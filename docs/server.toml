# EVAnalyzer server configuration - complete example.
#
#   evanalyzer server --config /etc/evanalyzer/server.toml
#
# Every key is optional: the values below are the defaults unless noted, so
# a real config only needs the lines that differ. Command-line arguments
# (--listen, --session-store, --log-level) override this file. Misspelled or
# unknown keys stop the server with an error. Changes apply on restart.
#
# The reference for each key is the doc comment of its field in
# crates/server/src/config.rs; the guide is docs/server.md. This file is
# parsed by the server's tests, so it always matches the code.

# Address and port to accept clients on. 127.0.0.1 = this machine only;
# 0.0.0.0:7400 accepts connections from every network.
listen = "127.0.0.1:7400"

# File the running workers are recorded in, so a restarted server finds them
# again. Default: /run/evanalyzer/sessions.json for a system service,
# otherwise in the temp folder.
# session_store = "/run/evanalyzer/sessions.json"

# What the server and its workers log: error, warn, info, debug, trace, off,
# or per module, e.g. "info,evanalyzer_core=debug".
log_level = "debug"

[users]
# Who may log in:
#   "single" - one account, configured in [users.single]
#   "linux"  - this machine's system users, see [users.linux]
#   "file"   - the accounts listed in a users file, see [users.file]
source = "single"

# Folders every user's worker may read and write, unless the account sets
# its own allowed_dirs. {home} stands for the user's home folder.
default_allowed_dirs = ["{home}"]

[users.single]
# Login name. Can be changed at any time: the account's internal id is fixed.
username = "admin"
# The password, hashed: create one with `evanalyzer hash-password`. Other
# formats: see "Passwords" in docs/server.md. This default is the hash of
# 1234: change it, the server warns while it is in use.
password = "$6$evadflt1$DreijyFMj134bmHDBJmfoHJ4XvqKCHiDcZ1n2.wW6Y0empPJcQNMXTirlHXd7PWi01YI0OWRMgRm/pZzB.P6B1"
# Home folder: the worker's working directory, where it keeps the user's
# settings and templates. Absolute path. Default: the home folder of the
# account the server runs as.
# home = "/srv/evanalyzer/admin"
# Default: users.default_allowed_dirs.
# allowed_dirs = ["{home}", "/data/microscopy"]

[users.linux]
# Passwords are checked against the shadow file (the server needs root or
# the shadow group); home, uid and gid come from the passwd file. Run as
# root, the server starts each worker as its user's system account.
shadow_file = "/etc/shadow"
passwd_file = "/etc/passwd"

# Per-user exceptions to users.default_allowed_dirs:
# [users.linux.overrides.alice]
# allowed_dirs = ["{home}", "/data/shared"]

[users.file]
# The users file - required for source = "file". Format: see
# docs/server-users.toml. Keep it readable by the server only (chmod 600).
# path = "/etc/evanalyzer/users.toml"
