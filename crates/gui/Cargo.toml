[package]
name = "evanalyzer_gui"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
evanalyzer_core = { workspace = true }
evanalyzer_app = { workspace = true }
evanalyzer_cfg = { workspace = true }
evanalyzer_gui_slint = { path = "ui" }

rfd = { workspace = true }
copypasta = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
kornia-image = { workspace = true }
kornia-imgproc = { workspace = true }
clru = { workspace = true }
indexmap = { workspace = true }
bitvec = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }



# For Linux/macOS: Use Skia
[target.'cfg(not(target_os = "windows"))'.dependencies.slint]
version = "1.17"
features = ["renderer-skia"]

# For Windows: Use Software Renderer (No Skia/VC++ requirement)
[target.'cfg(target_os = "windows")'.dependencies.slint]
version = "1.17"
default-features = false
features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "backend-winit",
]

[dev-dependencies]
kornia-apriltag = { workspace = true }
i-slint-backend-testing = "=1.17.1"
duckdb = { workspace = true, features = ["bundled"] }
tempfile = { workspace = true }


