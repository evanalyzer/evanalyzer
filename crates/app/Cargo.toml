[package]
name = "evanalyzer_app"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
evanalyzer_core = { workspace = true }
evanalyzer_cfg = { path = "../cfg" }

log = "0.4"
env_logger = "0.11"
indexmap = "2.13.0"
arc-swap = "1.9.0"
bitvec = "1.0.1"
pathdiff = "0.2.3"
rayon = "1.12.0"
human-sort = "0.2"
serde = "1.0.228"
serde_json = "1.0.149"
serde_yaml = "0.9"
regex = "1"
csv = "1"
rust_xlsxwriter = { version = "0", features = ["constant_memory"] }
dirs = "6"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "point_series", "ttf"] }
image = "0.24"




[dev-dependencies]
tempfile = "3"
# Test-only: builds a minimal results database directly via SQL (matching
# the schema `evanalyzer_core::storage::duckdb` writes) to exercise
# `ResultsExporter`/`ResultsLoader` end-to-end without needing a full
# pipeline run.
duckdb = { version = "1.1.3", features = ["bundled"] }
calamine = "0.36.0"

[lib]
name = "evanalyzer_app"
path = "src/lib.rs"
doctest = false
