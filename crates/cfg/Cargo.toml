[package]
name = "evanalyzer_cfg"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
quick-xml = "0.41"
serde_json = "1.0.151"
ndarray = "0.17.2"
serde = {version = "1.0.229", features = ["derive","rc"]}
thiserror = "2.0.19"
indexmap = {version ="2.14.0",features = ["serde"]}
bitvec = {version = "1.1.1", features = ["serde", "alloc","atomic","std"]}
schemars = { version = "1.2.2", features = ["indexmap2", "chrono04"] }
fast-uuid-v7 = "0.1"
chrono = { version = "0.4.45", features = ["serde"] }


[dev-dependencies]
# Nothing here right now - crates/cfg/tests/pipeline_command_coverage.rs
# only needs the crate's own public API.


[build-dependencies]
syn = { version = "3.0.3", features = ["full", "parsing"] }
quote = "1.0"
schemars = { version = "1.2.2", features = ["indexmap2", "chrono04"] }
serde_json = "1.0.151"
indexmap = {version ="2.14.0",features = ["serde"]}
serde = {version = "1.0.229", features = ["derive","rc"]}
bitvec = {version = "1.1.1", features = ["serde", "alloc","atomic","std"]}
fast-uuid-v7 = "0.1"
chrono = { version = "0.4.45", features = ["serde"] }


[lib]
name = "evanalyzer_cfg"
doctest = false
