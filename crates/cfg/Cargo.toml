[package]
name = "evanalyzer_cfg"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
quick-xml = { workspace = true }
serde_json = { workspace = true }
ndarray = { workspace = true }
serde = { workspace = true, features = ["derive","rc"] }
thiserror = "2.0.19"
indexmap = { workspace = true, features = ["serde"] }
bitvec = { workspace = true, features = ["serde", "alloc","atomic","std"] }
schemars = { workspace = true, features = ["indexmap2", "chrono04"] }
fast-uuid-v7 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

[build-dependencies]
# `syn` here is major version 3.x, deliberately not unified with `macros`'
# 2.x via workspace.dependencies - see the note in the root Cargo.toml.
syn = { version = "3.0.3", features = ["full", "parsing"] }
quote = "1.0"
schemars = { workspace = true, features = ["indexmap2", "chrono04"] }
serde_json = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive","rc"] }
bitvec = { workspace = true, features = ["serde", "alloc","atomic","std"] }
fast-uuid-v7 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }


[lib]
name = "evanalyzer_cfg"
doctest = false
