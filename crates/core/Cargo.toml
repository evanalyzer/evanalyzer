[package]
name = "evanalyzer_core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
macros = { path = "./macros" }
evanalyzer_cfg = { workspace = true }
kornia-tensor ={ workspace = true }
kornia-image = { workspace = true }
kornia-imgproc = { workspace = true }
kornia-apriltag = { workspace = true }
# Pinned transitive dep (image -> zune-jpeg -> zune-core), not used directly.
# zune-core 0.5.2 broke its `warn!`/`error!` fallback macros (they expand to
# nothing instead of `()`), which fails to compile wherever zune-jpeg calls
# them in expression position, e.g. mcu_prog.rs. Un-pin once upstream ships a
# fixed 0.5.x release.
zune-core = "=0.5.3"
image = { workspace = true }
log = { workspace = true }
# Pinned to a specific commit (not `branch = "main"`) for reproducible builds
# - bump deliberately with `cargo update -p bioformats --precise <rev>`, don't
# let it float. The "gpl" feature is deliberately *not* listed here; it's
# wired through our own `bioformats-gpl` feature below instead, so the
# workspace root can toggle it (see the `evanalyzer_core` comment in the root
# Cargo.toml).
bioformats = { git = "https://github.com/joda01/bioformats-rs", branch = "tif-read-fix", features = [
    "jpegxr",
    "zarr",
    "tissuefaxs",
] }
ndarray = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
indexmap = { workspace = true, features = ["serde", "rayon"] }
bitvec = { workspace = true, features = ["serde", "alloc", "atomic", "std"] }
csv = { workspace = true }
duckdb = { workspace = true }
tch = { version = "0.24.0", optional = true }
smartcore = { version = "0.5.5", features = ["serde"], optional = true }
burn = { version = "0.21", default-features = false, features = [
    "ndarray",
    "autodiff",
], optional = true }
serde_json = { workspace = true, optional = true }
petname = "3.1.0"
chrono = { workspace = true }
sysinfo = "0.39.6"

[features]
ai = ["dep:tch", "dep:smartcore", "dep:burn", "dep:serde_json"]
# Enables bioformats' own "gpl" feature - the GPL-2.0-or-later readers ported
# from upstream Bio-Formats' `formats-gpl` module (CZI, ND2, LIF, LSM, and
# others - see bioformats-rs' README for the full list). Disabling this drops
# those formats but yields a BSD-2-Clause-only bioformats build. Toggle from
# the workspace root, not here - see the `evanalyzer_core` comment in the
# root Cargo.toml.
bioformats-gpl = ["bioformats/gpl"]

[target.'cfg(target_os = "linux")'.dependencies]
duckdb = { workspace = true, features = ["bundled"] }

[dev-dependencies]
approx = "0.5"
env_logger = { workspace = true }
tempfile = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["zune-core"]

[lib]
name = "evanalyzer_core"
doctest = false
