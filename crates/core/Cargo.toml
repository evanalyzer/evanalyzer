[package]
name = "evanalyzer_core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
macros = { path = "./macros" }
evanalyzer_cfg = { path = "../cfg" }
kornia-tensor = { version = "0.1.14"}
kornia-image = { version = "0.1.14"}
kornia-imgproc = { version = "0.1.14"}
kornia-apriltag = { version = "0.1.10"}
# Pinned transitive dep (image -> zune-jpeg -> zune-core), not used directly.
# zune-core 0.5.2 broke its `warn!`/`error!` fallback macros (they expand to
# nothing instead of `()`), which fails to compile wherever zune-jpeg calls
# them in expression position, e.g. mcu_prog.rs. Un-pin once upstream ships a
# fixed 0.5.x release.
zune-core = "=0.5.3"
image = "0.25.0"
log = "0.4"
jni = {version = "0.22.4", features = ["invocation"]}
quick-xml = "0.41"
ndarray = "0.17.2"
rayon = "1.12"
serde = {version = "1.0.229", features = ["derive","rc"]}
indexmap = {version ="2.14.0",features = ["serde","rayon"]}
bitvec = {version = "1.1.1", features = ["serde", "alloc","atomic","std"]}
csv = "1.4.0"
duckdb = { version = "1.1.3" }
tch = { version = "0.24.0", optional = true }
smartcore = { version = "0.5.5", features = ["serde"], optional = true }
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"], optional = true }
serde_json = { version = "1", optional = true }
petname = "3.1.0"
chrono = "0.4.45"
sysinfo = "0.39.6"

[features]
ai = ["dep:tch", "dep:smartcore", "dep:burn", "dep:serde_json"]

[target.'cfg(target_os = "linux")'.dependencies]
duckdb = { version = "1.1.3", features = ["bundled"] }

[dev-dependencies]
approx = "0.5"
env_logger = "0.11"
tempfile = "3.27.0"


[lib]
name = "evanalyzer_core"
doctest = false
