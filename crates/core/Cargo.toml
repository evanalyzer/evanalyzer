[package]
name = "evanalyzer_core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
macros = { path = "./macros" }
evanalyzer_cfg = { workspace = true }
kornia-image = { workspace = true }
kornia-imgproc = { workspace = true }
# Pinned transitive dep (image -> zune-jpeg -> zune-core), not used directly.
# zune-core 0.5.2 broke its `warn!`/`error!` fallback macros (they expand to
# nothing instead of `()`), which fails to compile wherever zune-jpeg calls
# them in expression position, e.g. mcu_prog.rs. Un-pin once upstream ships a
# fixed 0.5.x release.
zune-core = "=0.5.3"
image = { workspace = true }
log = { workspace = true }
scopeio = { workspace = true }
ndarray = { workspace = true }
rayon = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
indexmap = { workspace = true, features = ["serde", "rayon"] }
bitvec = { workspace = true, features = ["serde", "alloc", "atomic", "std"] }
csv = { workspace = true }
duckdb = { workspace = true, features = ["appender-arrow"] }
smartcore = { workspace = true, features = ["serde"] }
burn = { workspace = true }
evanalyzer_ai = { workspace = true }
serde_json = { workspace = true }
petname =  { workspace = true }
chrono = { workspace = true }
sysinfo =  { workspace = true }
postcard = { workspace = true }
tempfile = { workspace = true }
fast-uuid-v7 = { workspace = true }
clru = { workspace = true }
rhai = { workspace = true }

[features]
# AI models (Cellpose, StarDist, U-Net, YOLOv5) through the libtorch plugin
# library, loaded on the first model run (see `evanalyzer_ai`). The
# plugin is built on its own: `cargo build-ai-plugin`. Without it, model
# steps report that the build has no AI model support; trained classifiers
# (Burn, smartcore) work either way.
libtorch = ["evanalyzer_ai/torch-plugin"]
# libtorch linked into the process instead of the plugin - for the model
# steps' tests (`cargo test -p evanalyzer_core --features libtorch-in-process`).
libtorch-in-process = ["evanalyzer_ai/test-support"]

[target.'cfg(target_os = "linux")'.dependencies]
duckdb = { workspace = true, features = ["bundled"] }

[dev-dependencies]
approx = { workspace = true }
env_logger = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["zune-core"]

[lib]
name = "evanalyzer_core"
doctest = false
