[package]
name = "evanalyzer_core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
macros = { path = "./macros" }
evanalyzer_cfg = { workspace = true }
kornia-tensor = { version = "0.1.14"}
kornia-image = { workspace = true }
kornia-imgproc = { workspace = true }
kornia-apriltag = { workspace = true }
# Pinned transitive dep (image -> zune-jpeg -> zune-core), not used directly.
# zune-core 0.5.2 broke its `warn!`/`error!` fallback macros (they expand to
# nothing instead of `()`), which fails to compile wherever zune-jpeg calls
# them in expression position, e.g. mcu_prog.rs. Un-pin once upstream ships a
# fixed 0.5.x release.
zune-core = "=0.5.3"
image = { workspace = true }
log = { workspace = true }
# cargo update -p bioformats
#bioformats = { git = "https://github.com/joda01/bioformats-rs", branch = "flatten" }
bioformats = { git = "https://github.com/henriksson-lab/bioformats-rs", branch = "main" }
ndarray = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive","rc"] }
indexmap = { workspace = true, features = ["serde","rayon"] }
bitvec = { workspace = true, features = ["serde", "alloc","atomic","std"] }
csv = { workspace = true }
duckdb = { workspace = true }
tch = { version = "0.24.0", optional = true }
smartcore = { version = "0.5.5", features = ["serde"], optional = true }
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"], optional = true }
serde_json = { workspace = true, optional = true }
petname = "3.1.0"
chrono = { workspace = true }
sysinfo = "0.39.6"

[features]
ai = ["dep:tch", "dep:smartcore", "dep:burn", "dep:serde_json"]

[target.'cfg(target_os = "linux")'.dependencies]
duckdb = { workspace = true, features = ["bundled"] }

[dev-dependencies]
approx = "0.5"
env_logger = { workspace = true }
tempfile = { workspace = true }

[package.metadata.cargo-machete]
# zune-core is a deliberate version pin (see comment above), not a real
# dependency of our own code - see the comment on the `zune-core` line above.
ignored = ["zune-core"]

[lib]
name = "evanalyzer_core"
doctest = false
