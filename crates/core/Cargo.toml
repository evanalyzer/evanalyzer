[package]
name = "evanalyzer_core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
macros = { path = "./macros" }
evanalyzer_cfg = { path = "../cfg" }
kornia-tensor = { version = "0.1.14"}
kornia-tensor-ops = { version = "0.1.14"}
kornia-io = { version = "0.1.14"}
kornia-image = { version = "0.1.14"}
kornia-imgproc = { version = "0.1.14"}
kornia-3d = { version = "0.1.14"}
kornia-apriltag = { version = "0.1.10"}
#kornia-vlm = "0.1"
#kornia-nn = { version = "0.1.14"}
kornia-algebra = { version = "0.1.14"}
image = "0.24"   
log = "0.4"        
jni = {version = "0.21", features = ["invocation"]}
libloading = "0.8"
quick-xml = "0.41"
ndarray = "0.17.2"
rayon = "1.10"
serde = {version = "1.0.228", features = ["derive","rc"]}
thiserror = "2.0.18"
indexmap = {version ="2.13.0",features = ["serde","rayon"]}
pathdiff = "0.2"
human-sort = "0.2.2"
bitvec = {version = "1.0.1", features = ["serde", "alloc","atomic","std"]}
csv = "1.4.0"
duckdb = { version = "1.1.3" }
tch = { version = "0.24.0", optional = true }
smartcore = { version = "0.4", features = ["serde"], optional = true }
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"], optional = true }
serde_json = { version = "1", optional = true }
petname = "3.0.0"
chrono = "0.4.44"
sysinfo = "0.33"

[features]
ai = ["dep:tch", "dep:smartcore", "dep:burn", "dep:serde_json"]

[target.'cfg(target_os = "linux")'.dependencies]
duckdb = { version = "1.1.3", features = ["bundled"] }

[dev-dependencies]
approx = "0.5"
env_logger = "0.11"
tempfile = "3.27.0"


[build-dependencies]
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
indexmap = {version ="2.13.0",features = ["serde"]}



[lib]
name = "evanalyzer_core"
doctest = false
