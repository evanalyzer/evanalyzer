[package]
name = "evanalyzer_bin"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
evanalyzer_cfg = { workspace = true }
evanalyzer_gui    = { workspace = true }
evanalyzer_cli    = { workspace = true }
evanalyzer_app    = { workspace = true }
evanalyzer_server    = { workspace = true }
evanalyzer_llm    = { workspace = true, optional = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rpassword = { workspace = true }

# Off by default: local-LLM pipeline generation is too slow on CPU for a
# shipped desktop build right now. Build with `--features llm` to include it.
[features]
llm = ["dep:evanalyzer_llm"]

[[bin]]
name = "evanalyzer"
path = "src/main.rs"
