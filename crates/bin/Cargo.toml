[package]
name = "evanalyzer_bin"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
evanalyzer_cfg = { workspace = true }
evanalyzer_gui    = { workspace = true }
evanalyzer_cli    = { workspace = true }
evanalyzer_app    = { workspace = true }
evanalyzer_server    = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rpassword = { workspace = true }

[features]
default = ["libtorch"]
# AI models (Cellpose, StarDist, U-Net, YOLOv5) through the libtorch plugin,
# loaded on the first model run - the plugin itself is built on its own:
# `cargo build-ai-plugin`. `--no-default-features` builds
# without it (trained classifiers still work).
libtorch = ["evanalyzer_app/libtorch"]

[[bin]]
name = "evanalyzer"
path = "src/main.rs"
