[package]
name = "evanalyzer_bin"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
evanalyzer_cfg = { workspace = true }
evanalyzer_gui    = { workspace = true, optional = true }
evanalyzer_cli    = { workspace = true }
evanalyzer_app    = { workspace = true }
evanalyzer_server    = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true, features = ["derive", "wrap_help"] }
rpassword = { workspace = true }

[features]
default = ["gui"]
# The desktop app (Slint). Without it (`--no-default-features`): the command
# line, server and worker only - no font or display libraries needed, e.g.
# for a container image.
gui = ["dep:evanalyzer_gui"]

[[bin]]
name = "evanalyzer"
path = "src/main.rs"
