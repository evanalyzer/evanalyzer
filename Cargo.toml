[workspace]
resolver = "2"

members = [
    "crates/*",
    "crates/gui/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Joachim Danmayr"]
license = "AGPL-3.0"
publish = false


[workspace.dependencies]
# Toggle the AI (libtorch/tch) feature here — remove "ai" from features to disable
evanalyzer_core = { path = "crates/core", features = ["ai"] }
evanalyzer_cfg = { path = "crates/cfg" }
evanalyzer_app = { path = "crates/app" }
bitvec = "1.1.1"
chrono = "0.4.45"
clap = "4"
csv = "1.4.0"
duckdb = "1.1.3"
env_logger = "0.11"
fast-uuid-v7 = "0.1"
image = "0.25.10"
indexmap = "2.14.0"
kornia-apriltag = "0.1.10"
kornia-image = "0.1.14"
kornia-imgproc = "0.1.14"
log = "0.4"
ndarray = "0.17.2"
quick-xml = "0.41"
rayon = "1.12.0"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"] }


[profile.release]
strip = true
lto = "thin"
codegen-units = 16
debug = false