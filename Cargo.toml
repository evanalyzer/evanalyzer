[workspace]
resolver = "2"

members = [
    "crates/*",
    "crates/gui/ui",
]

# `crates/llm` (local-LLM pipeline generation via candle) is opt-in only - it's
# too slow on CPU for a shipped desktop feature right now, and pulls in a heavy
# dependency tree (candle, llguidance, tokenizers). Excluding it from
# default-members keeps plain `cargo build`/`test`/`check` (no `-p`, no
# `--workspace`) from building it; `-p evanalyzer_llm` or `--workspace` still can.
default-members = [
    "crates/app",
    "crates/bin",
    "crates/cfg",
    "crates/cli",
    "crates/core",
    "crates/gui",
    "crates/gui/ui",
    "crates/server"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Joachim Danmayr"]
license = "AGPL-3.0"
publish = false


[workspace.dependencies]
# Toggle the AI (libtorch/tch) feature here — remove "ai" from features to disable.
# Toggle GPL-derived Bio-Formats readers (CZI, ND2, LIF, LSM, and others) here
# via "bioformats-gpl" — remove it to build a BSD-2-Clause-only bioformats,
# which drops those formats but is safe to distribute closed-source without
# the AGPL/commercial dual-license question applying to that dependency.
evanalyzer_core = { path = "crates/core", features = ["ai", "bioformats-gpl"] }
evanalyzer_cfg = { path = "crates/cfg" }
evanalyzer_app = { path = "crates/app" }
evanalyzer_llm = { path = "crates/llm" }
evanalyzer_gui    = { path = "crates/gui" }
evanalyzer_cli    = { path = "crates/cli" }
evanalyzer_server = { path = "crates/server" }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tungstenite = "0.30.0"
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17"
webpki-roots = "1"
toml = "1.1.6"
rpassword = "7"
getrandom = "0.4.3"
bitvec = "1.1.1"
chrono = "0.4.45"
clap = "4.6.7"
csv = "1.4.0"
duckdb = "1.1.3"
env_logger = "0.11"
fast-uuid-v7 = "0.1.9"
image = "0.25.10"
indexmap = "2.14.2"
kornia-image = "0.2.0"
kornia-imgproc = "0.2.0"
slint = { version = "1.18", default-features = false }
slint-build = { version = "1.18"}
log = "0.4.34"
ndarray = "0.17.2"
quick-xml = "0.42.0"
rayon = "1.12.0"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"] }
candle-core = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.23.2"
llguidance = "1.9.1"
clru = "0.6.3"
sysinfo = "0.39.6"
petname = "3.2.0"
tch =  "0.24.0"
smartcore = "0.5.5"
approx = "0.5"
ctrlc = "3"
thiserror = "2.0.21"
syn = { version = "3.0.6", features = ["full", "parsing"] }
quote = "1.0"
pathdiff = "0.2.3"
serde_yaml = "0.9"
human-sort = "0.2"
rust_xlsxwriter =  "0.99.1"
dirs = "7.0.0"
calamine = "0.36.1"
sha-crypt = "0.6.0"
bcrypt = "0.19.3"
argon2 = "0.6.0"
yescrypt = { version = "0.1.0", default-features = false, features = ["password-hash"] }


[profile.release]
strip = true
lto = "thin"
codegen-units = 16
debug = false


