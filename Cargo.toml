[workspace]
resolver = "2"

members = [
    "crates/*",
    "crates/gui/ui",
]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
authors = ["Joachim Danmayr"]
license = "PolyForm-Noncommercial-1.0.0"
publish = false


[workspace.dependencies]
evanalyzer_core = { path = "crates/core" }
evanalyzer_cfg = { path = "crates/cfg" }
evanalyzer_ai = { path = "crates/ai" }
evanalyzer_nn = { path = "crates/nn" }
evanalyzer_app = { path = "crates/app" }
evanalyzer_gui    = { path = "crates/gui" }
evanalyzer_cli    = { path = "crates/cli" }
evanalyzer_server = { path = "crates/server" }
scopeio = { git = "https://github.com/evanalyzer/scopeio", tag = "0.0.0-alpha.5" }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tungstenite = "0.30.0"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17"
webpki-roots = "1.0.12"
serde-reflection = "0.7.0"
toml = "1.1.6"
rpassword = "7.5.5"
getrandom = "0.4.3"
bitvec = "1.1.1"
chrono = "0.4.45"
clap = "4.6.9"
csv = "1.4.0"
duckdb = "1.1.3"
env_logger = "0.11.12"
fast-uuid-v7 = "0.1.11"
image = "0.25.10"
# Charts as PNG (the SVG of the chart module). The features Slint already
# builds it with - one build of it for both.
resvg = { version = "0.49", default-features = false, features = ["gif", "image-webp", "raster-images", "svgz", "text"] }
png = "0.18"
indexmap = "2.14.2"
kornia-image = "0.2.0"
kornia-imgproc = "0.2.0"
slint = { version = "1.19", default-features = false }
slint-build = { version = "1.19"}
log = "0.4.35"
ndarray = "0.17.2"
quick-xml = "0.42.0"
rayon = "1.12.0"
rustfft = "6.4.1"
schemars = "1.2.3"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
# Held at 0.21: burn 0.22 needs its `std` feature for the optimizers, and
# `std` drags its (deprecated) `burn-tch` into the lockfile - it links
# libtorch through torch-sys 0.22, which collides with `tch`'s torch-sys
# 0.26 (only one crate may link `tch`). Upgrade once burn drops burn-tch.
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"] }
clru = "0.6.3"
sysinfo = "0.40.4"
petname = "3.2.0"
tch =  "0.26.0"
libloading = "0.9.1"
smartcore = "0.7.0"
approx = "0.5"
ctrlc = "3.5.3"
thiserror = "2.0.21"
syn = { version = "3.0.10", features = ["full", "parsing"] }
quote = "1.0"
pathdiff = "0.2.3"
human-sort = "0.2"
regex = "1.13.2"
sha2 = "0.11.1"
rust_xlsxwriter =  "0.104.0"
zmij = "1.0.23"
dirs = "7.0.0"
calamine = "0.38.0"
sha-crypt = "0.6.0"
bcrypt = "0.19.3"
argon2 = "0.6.0"
yescrypt = { version = "0.1.0", default-features = false, features = ["password-hash"] }
rhai = "1.27.0"
libc = "0.2.191"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
debug = false

# Temporary, see patches/README.md: burn-dispatch without its optional burn-tch
# (collides with tch's `links`); goes with crates/ai.
[patch.crates-io]
burn-dispatch = { path = "patches/burn-dispatch" }
