[workspace]
resolver = "2"

members = [
    "crates/*",
    "crates/gui/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Joachim Danmayr"]
license = "PolyForm-Noncommercial-1.0.0"
publish = false


[workspace.dependencies]
evanalyzer_core = { path = "crates/core" }
evanalyzer_cfg = { path = "crates/cfg" }
evanalyzer_ai = { path = "crates/ai" }
evanalyzer_app = { path = "crates/app" }
evanalyzer_gui    = { path = "crates/gui" }
evanalyzer_cli    = { path = "crates/cli" }
evanalyzer_server = { path = "crates/server" }
scopeio = { git = "https://github.com/evanalyzer/scopeio", tag = "0.0.0-alpha.3" }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tungstenite = "0.30.0"
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17"
webpki-roots = "1"
serde-reflection = "0.6"
toml = "1.1.6"
rpassword = "7"
getrandom = "0.4.3"
bitvec = "1.1.1"
chrono = "0.4.45"
clap = "4.6.7"
csv = "1.4.0"
duckdb = "1.1.3"
env_logger = "0.11"
fast-uuid-v7 = "0.1.9"
image = "0.25.10"
indexmap = "2.14.2"
kornia-image = "0.2.0"
kornia-imgproc = "0.2.0"
slint = { version = "1.18", default-features = false }
slint-build = { version = "1.18"}
log = "0.4.34"
ndarray = "0.17.2"
quick-xml = "0.42.0"
rayon = "1.12.0"
rustfft = "6.4.1"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3.27.0"
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"] }
clru = "0.6.3"
sysinfo = "0.39.6"
petname = "3.2.0"
tch =  "0.26.0"
libloading = "0.8.9"
smartcore = "0.5.5"
approx = "0.5"
ctrlc = "3"
thiserror = "2.0.21"
syn = { version = "3.0.6", features = ["full", "parsing"] }
quote = "1.0"
pathdiff = "0.2.3"
serde_yaml = "0.9"
human-sort = "0.2"
regex = "1.13"
rust_xlsxwriter =  "0.99.1"
zmij = "1.0.23"
dirs = "7.0.0"
calamine = "0.36.1"
sha-crypt = "0.6.0"
bcrypt = "0.19.3"
argon2 = "0.6.0"
yescrypt = { version = "0.1.0", default-features = false, features = ["password-hash"] }
rhai = "1.26.1"
libc = "0.2.190"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
debug = false


