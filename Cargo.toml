[workspace]
resolver = "2"

members = [
    "crates/*",
    "crates/gui/ui",
]

# `crates/llm` (local-LLM pipeline generation via candle) is opt-in only - it's
# too slow on CPU for a shipped desktop feature right now, and pulls in a heavy
# dependency tree (candle, llguidance, tokenizers). Excluding it from
# default-members keeps plain `cargo build`/`test`/`check` (no `-p`, no
# `--workspace`) from building it; `-p evanalyzer_llm` or `--workspace` still can.
default-members = [
    "crates/app",
    "crates/bin",
    "crates/cfg",
    "crates/cli",
    "crates/core",
    "crates/gui",
    "crates/gui/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Joachim Danmayr"]
license = "AGPL-3.0"
publish = false


[workspace.dependencies]
# Toggle the AI (libtorch/tch) feature here — remove "ai" from features to disable
evanalyzer_core = { path = "crates/core", features = ["ai"] }
evanalyzer_cfg = { path = "crates/cfg" }
evanalyzer_app = { path = "crates/app" }
evanalyzer_llm = { path = "crates/llm" }
bitvec = "1.1.1"
chrono = "0.4.45"
clap = "4"
csv = "1.4.0"
duckdb = "1.1.3"
env_logger = "0.11"
fast-uuid-v7 = "0.1"
image = "0.25.10"
indexmap = "2.14.0"
kornia-apriltag = "0.1.10"
kornia-image = "0.1.14"
kornia-imgproc = "0.1.14"
log = "0.4"
ndarray = "0.17.2"
quick-xml = "0.41"
rayon = "1.12.0"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff"] }


[profile.release]
strip = true
lto = "thin"
codegen-units = 16
debug = false