# cargo-about configuration for the About dialog's license list
# (crates/gui/src/generated/third_party_licenses.json; non-crate notices -
# ported code, fonts, native libraries - are in
# crates/gui/src/third_party_notices.json, kept by hand).
#
# Regenerate (from the repo root; CI checks the result is up to date):
#
#   cargo about generate --locked --workspace --features evanalyzer_ai/torch \
#       docs/about.hbs -o crates/gui/src/generated/third_party_licenses.json
#
# `--workspace` covers every shipped binary (the app, the server, ...);
# `evanalyzer_ai/torch` adds the AI plugin's crates (tch, torch-sys, ...) -
# the plugin is evanalyzer_ai built with that feature
# (`cargo build-ai-plugin`, .cargo/config.toml). cargo-about only reads
# `cargo metadata`, so libtorch need not be installed. Install it with
# `cargo install cargo-about --locked --version 0.9.3 --features cli`
# (the version CI uses - another version may format the output differently).

# Dev-dependencies (test helpers like i-slint-backend-testing) never ship.
ignore-dev-dependencies = true

accepted = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "IJG",
    "NCSA",
    "bzip2-1.0.6"
]

# evanalyzer's own workspace crates are all `publish = false` (see the
# `[workspace.package]` entry in the root Cargo.toml) - they're internal
# application crates, not published anywhere. This listing is meant to cover
# third-party dependencies only, so keep our own crates (PolyForm Noncommercial) out of it.
[private]
ignore = true

# Copyleft licenses are deliberately *not* in the global `accepted` list above,
# so a new dependency pulling in GPL/LGPL fails the build by default instead
# of silently being allowed. Each crate below is a known, reviewed exception -
# `accepted` here is additive to the global list, scoped to just this crate
# (see https://embarkstudios.github.io/cargo-about/cli/generate/config.html).

# Slint is used under its Royalty-free License 2.0 (not GPL) - see
# https://slint.dev/terms-and-conditions#royalty-free. Its crates declare
# "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
# LicenseRef-Slint-Software-3.0"; the clarify below picks the Royalty-free
# license and its text (LICENSES/ in each crate), so GPL-3.0 is not accepted
# for them at all. The checksum is that file's sha256 - when a Slint update
# changes it, cargo-about fails: review the new text and update it.
#
# The files' `license` is deliberately "<id>-text", not the id itself:
# cargo-about 0.9.3 inverts the match for LicenseRef-* texts (generate.rs,
# the `LicenseItem::Other` arm keeps the clarified files whose license does
# *not* name the LicenseRef). With the id itself the text is dropped ("has
# no license file" warning). If a newer cargo-about fixes that, the CI diff
# shows the Slint text gone - then use the id itself here (and for scopeio).
[i-slint-backend-selector]
accepted = ["LicenseRef-Slint-Royalty-free-2.0"]
[i-slint-backend-selector.clarify]
license = "LicenseRef-Slint-Royalty-free-2.0"
[[i-slint-backend-selector.clarify.files]]
path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md"
license = "LicenseRef-Slint-Royalty-free-2.0-text"
checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe"
[i-slint-backend-winit]
accepted = ["LicenseRef-Slint-Royalty-free-2.0"]
[i-slint-backend-winit.clarify]
license = "LicenseRef-Slint-Royalty-free-2.0"
[[i-slint-backend-winit.clarify.files]]
