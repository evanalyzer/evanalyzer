# scopeio (image reading) is AGPL-3.0-only with an additional permission for
# EVAnalyzer (its LICENSE-EXCEPTION): combined with EVAnalyzer it may be
# conveyed under EVAnalyzer's license terms. Same author as evanalyzer. The
# clarify lists the exception's text next to the AGPL text (the files'
# `license` values work around cargo-about 0.9.3, see Slint above).
[scopeio]
accepted = ["AGPL-3.0-only", "LicenseRef-scopeio-EVAnalyzer-exception"]
[scopeio.clarify]
license = "AGPL-3.0-only AND LicenseRef-scopeio-EVAnalyzer-exception"
[[scopeio.clarify.files]]
path = "LICENSE"
license = "AGPL-3.0-only AND LicenseRef-scopeio-EVAnalyzer-exception"
checksum = "0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0"
[[scopeio.clarify.files]]
path = "LICENSE-EXCEPTION"
license = "LicenseRef-scopeio-EVAnalyzer-exception-text"
checksum = "2fdef09e45fb8067fb50dfcbda3f38b82695d6e3294f2c491b290d493b864d87"

# MPL-2.0: smartstring (via rhai) and option-ext (via dirs -> dirs-sys).
# Owner reviewed 2026-10-26 - MPL-2.0 is file-level copyleft; both crates
# ship unmodified, listed with their license and source in the About dialog.
[smartstring]
accepted = ["MPL-2.0"]
[option-ext]
accepted = ["MPL-2.0"]
