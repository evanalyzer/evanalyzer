[alias]
build-win       = ["xwin", "build", "--target", "x86_64-pc-windows-msvc",   "--release"]
build-win-arm   = ["xwin", "build", "--target", "aarch64-pc-windows-msvc",   "--release"]
build-linux     = ["build", "--target", "x86_64-unknown-linux-gnu",          "--release"]
build-linux-arm = ["build", "--target", "aarch64-unknown-linux-gnu",         "--release"]
build-mac       = ["build", "--target", "aarch64-apple-darwin",              "--release"]
# Without the desktop app (command line, server, worker): no font or display
# libraries needed - for servers, compute clusters and the Docker image.
build-linux-cli     = ["build", "--target", "x86_64-unknown-linux-gnu",  "--release", "-p", "evanalyzer_bin", "--no-default-features"]
build-linux-arm-cli = ["build", "--target", "aarch64-unknown-linux-gnu", "--release", "-p", "evanalyzer_bin", "--no-default-features"]
# After a dependency change: regenerates the About dialog's license list
# (cargo-about, the command ci.yml's `licenses` job checks - install it as
# about.toml says) and THIRD-PARTY-NOTICES.txt from it. An ignored test in
# the gui crate, so it reuses the dev test build.
update-licenses = ["test", "-p", "evanalyzer_gui", "--lib", "third_party_licenses::tests::regenerate", "--", "--ignored", "--exact"]

# For Windows (MSVC) — statically linked CRT, lld linker
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "target-feature=+crt-static",
    "-L", "native=libs/libduckdb-windows-amd64",
]

# For Windows ARM64 (MSVC) — statically linked CRT
[target.aarch64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-L", "native=libs/libduckdb-windows-arm64",
]

# For Linux x86_64
# The extra rpath lets the binary find shared libraries next to itself.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "link-arg=-Wl,-rpath,$ORIGIN"]

# For Linux ARM64 — requires aarch64-linux-gnu-gcc cross-toolchain
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "link-arg=-Wl,-rpath,$ORIGIN"]

# For macOS ARM64 (Apple Silicon)
# @loader_path is macOS's equivalent of $ORIGIN: it lets the binary find the
# libduckdb .dylib files shipped next to it (see release.yml packaging).
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path"]

[build]
# Share build artifacts across projects to save space
incremental = false 

[profile.dev]
# Reduce debug info size (0 = no debug info, 1 = line tables only, 2 = full)
debug = 1

# No debug info for dependencies - only for our own crates. Above all it
# keeps DuckDB's C++ (compiled with -g otherwise) out of every test and
# example binary, which made each one hundreds of MB. Backtraces still show
# our own code; stepping into dependency internals needs a temporary
# override.
[profile.dev.package."*"]
debug = false 