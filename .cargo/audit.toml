# Config for `cargo audit` (see .github/workflows/ci.yml's `audit` job and
# README.md's "Dependency Audit" section). Read automatically from this path
# - no `-c` flag needed.
[advisories]
ignore = [
    # rkyv 0.7.46, pulled in by rust_decimal (a duckdb dependency) via its
    # optional "rkyv" feature. That feature is NOT enabled anywhere in this
    # workspace - `cargo tree -e features -i rust_decimal` shows only
    # default/serde/std active, and there is no `rkyv` build artifact under
    # target/ after a full `cargo check --workspace`. Cargo.lock still lists
    # rkyv as an edge because its `dependencies` array records every
    # possible optional dependency of a resolved package version, not just
    # the ones actually feature-activated - so cargo-audit flags a crate
    # that is never actually compiled into evanalyzer.
    #
    # Re-verify this (`cargo tree -e features -i rust_decimal`, check
    # target/ for rkyv artifacts) before removing the ignore, and drop it
    # immediately if duckdb or rust_decimal ever start requesting the
    # "rkyv" feature.
    "RUSTSEC-2026-0235",

    # "Unmaintained crate" warnings, not vulnerabilities: none of these are
    # direct dependencies, and unlike the quick-xml-style advisories, there's
    # no version bump that clears them - each one flags the crate as a whole
    # (every published version, including the latest), so pinning higher
    # doesn't help. Nothing to do on evanalyzer's side until the pulling
    # dependency migrates away from it upstream. Re-run `cargo tree -i
    # <crate>` after bumping `burn` or `slint` to check whether it's still
    # in the tree before re-adding an ignore for it.

    # bincode 2.0.1 (RUSTSEC-2025-0141, "Bincode is unmaintained") - pulled
    # in by burn-core (the `ai` feature's ML framework), not used directly:
    # evanalyzer_core::ai_learning::model.rs deliberately serializes as JSON
    # instead, specifically because bincode's development had ceased.
    "RUSTSEC-2025-0141",

    # paste 1.0.15 (RUSTSEC-2024-0436, "no longer maintained") - pulled in
    # by burn-ndarray (`ai` feature). A tiny, extremely widely-used
    # proc-macro (identifier concatenation) with no unresolved issues; the
    # unmaintained status is about the repository, not a known defect.
    "RUSTSEC-2024-0436",

    # rustybuzz 0.20.1 (RUSTSEC-2026-0206) and ttf-parser 0.20.0 / 0.25.1
    # (RUSTSEC-2026-0192, one advisory ID covers both resolved versions) -
    # font shaping/parsing. ttf-parser 0.20.0 comes from `plotters` (used by
    # evanalyzer_app directly for chart rendering); rustybuzz and
    # ttf-parser 0.25.1 come from `resvg`/`usvg`/`fontdb`, pulled in by
    # Slint's SVG icon rendering support.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]
