name: CI

# Runs the test suite (+ coverage) on every push to main/beta-fix and every
# pull request. Separate from release.yml (which only builds release
# binaries on a version tag) so PRs never trigger the expensive
# multi-platform/CUDA release matrix.
#
# beta-fix is listed alongside main so this workflow can be verified end to
# end before it's relied on - the GitHub Pages coverage deploy further below
# still only fires on main, not on beta-fix.
#
# Nothing here commits back to the repository: the coverage report and its
# badge live on GitHub Pages, the audit result in the job summary.
on:
  push:
    branches: ["main", "beta-fix"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux CPU only, per the beta-readiness review: it's enough to gate
    # merges, and avoids paying for CUDA/Windows/macOS runners on every push.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.3.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        # The toolchain image runs workflow steps as a different user than
        # the one actions/checkout ran as on the host, so git's ownership
        # check (safe.directory) refuses every git command in this job.
        # Needed in every job that uses this container, not just this one.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-test

      - name: Download native dependencies (libtorch CPU)
        # The AI engine crate's `torch` engine links libtorch, and the model
        # steps' tests run it in-process (`libtorch-in-process`
        # below). DuckDB does not need a download on Linux:
        # crates/core/Cargo.toml enables its `bundled` feature for
        # `cfg(target_os = "linux")`, so it's compiled from source instead.
        run: ./libs/download.sh linux-cpu

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage instrumentation
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/libs/libtorch/lib
          # The instrumented build got OOM-killed (exit 137) on the runner.
          # Coverage needs no debug info, and fewer parallel rustc/linker
          # processes keep the peak below the runner's RAM.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        # `libtorch-in-process`: the AI model steps' tests run libtorch in
        # the test process; `libtorch`: the plugin loader, whose test builds
        # and loads the real plugin.
        run: >-
          cargo llvm-cov --workspace --no-report
          --features evanalyzer_core/libtorch,evanalyzer_core/libtorch-in-process

      - name: Generate coverage reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Publish coverage to the job summary
        run: |
          {
            echo "## Code coverage"
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/html/

      - name: Build the GitHub Pages site (push to main only)
        # The HTML report plus a shields.io endpoint JSON the README's
        # coverage badge reads - no badge or history file is committed.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          # Line coverage is the 10th whitespace-separated field of the
          # TOTAL row (header: Regions/Missed/Cover, Functions/Missed/Exec,
          # Lines/Missed/Cover, Branches/Missed/Cover).
          PCT=$(awk '/^TOTAL/ {print $10}' coverage-summary.txt | tr -d '%')
          INT_PCT="${PCT%.*}"
          # Colour bands, loosely matching shields.io's own coverage scale.
          color="red"
          if   [ "${INT_PCT}" -ge 90 ]; then color="brightgreen"
          elif [ "${INT_PCT}" -ge 75 ]; then color="green"
          elif [ "${INT_PCT}" -ge 60 ]; then color="yellow"
          elif [ "${INT_PCT}" -ge 40 ]; then color="orange"
          fi
          mkdir -p site
          cp -r target/llvm-cov/html/. site/
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "${PCT}" "${color}" > site/coverage-badge.json

      - name: Upload the GitHub Pages site (push to main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  pages:
    # Deploys the coverage report built by `test`. A separate job because
    # deploy-pages needs the `github-pages` environment and its own
    # permissions, which the test job (running untrusted PR code) shouldn't
    # carry.
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  fmt:
    # Checks that source is `cargo fmt`-clean, including the files
    # `evanalyzer_cfg`'s build.rs (re-)generates - see
    # crates/cfg/build/pipeline_commands_generator.rs - which writes
    # crates/cfg/src/modules/pipeline_command*.rs and
    # crates/core/src/job/algos_from_config.rs, running each through
    # `rustfmt` itself as part of generation.
    #
    # A plain checkout isn't enough to check those files correctly: the
    # committed copies could be stale relative to the algo structs they're
    # derived from, so this builds `evanalyzer_cfg` first to regenerate
    # them before running `cargo fmt --check` against the result.
    # `evanalyzer_cfg` has no native dependencies (it doesn't depend on
    # evanalyzer_core), so this is cheap and doesn't need the libtorch/JRE
    # downloads the `test` job pays for.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.3.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-fmt

      - name: Regenerate build-script-generated source
        run: cargo check -p evanalyzer_cfg

      - name: Check formatting
        run: cargo fmt --check

  templates:
    # Templates (`.evatemplate`/`.evamodule`) live in a separate repository
    # (evanalyzer/evanalyzer-templates), not this one - see release.yml's
    # "templates" job for how they're fetched/shipped. This checks every
    # template there - not just the subset release.yml actually ships -
    # still deserializes as ProjectTemplate/ModuleTemplate under this
    # repo's current schema (crates/cfg/examples/check_templates.rs),
    # catching a schema change breaking published templates as early as a
    # push/PR here, rather than only at release time.
    #
    # `evanalyzer_cfg` has no native dependencies, so - like `fmt` - this
    # doesn't need the libtorch/JRE downloads the `test` job pays for.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.3.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-check-templates

      - name: Fetch every template (partial clone - no example images downloaded)
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/evanalyzer/evanalyzer-templates.git evanalyzer-templates
          git -C evanalyzer-templates sparse-checkout set --no-cone '*.evatemplate' '*.evamodule'

      - name: Check every template against the current schema
        run: cargo run -p evanalyzer_cfg --example check_templates -- evanalyzer-templates

  licenses:
    # The About dialog's license list
    # (crates/gui/src/generated/third_party_licenses.json) must match
    # Cargo.lock: regenerate it with the command from about.toml and fail on
    # any difference - a new or updated dependency then can't ship without
    # its license text, and a license outside about.toml's accepted list
    # fails the generation itself. Needs only `cargo metadata`, no build.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.3.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install cargo-about
        # Pinned: about.toml works around a 0.9.3 bug, and another version
        # may format the output differently.
        run: |
          if [ "$(cargo about --version 2>/dev/null)" != "cargo-about 0.9.3" ]; then
            cargo install cargo-about --locked --version 0.9.3 --features cli
          fi

      - name: Regenerate the license list
        run: |
          cargo about generate --locked --workspace --features evanalyzer_ai/torch \
            docs/about.hbs -o crates/gui/src/generated/third_party_licenses.json

      - name: Fail if it changed
        run: |
          git diff --exit-code -- crates/gui/src/generated/third_party_licenses.json || {
            echo "::error::third_party_licenses.json is out of date - regenerate it with the command in about.toml and commit it."
            exit 1
          }

  audit:
    # Dependency/license audit via cargo-audit (RUSTSEC advisory DB). Only
    # needs Cargo.lock, not a full build, so it's a separate lightweight job
    # rather than a step tacked onto `test` - no libtorch/JRE download, no
    # compilation.
    #
    # Informational, not a merge gate: it doesn't fail the job on findings
    # (mirrors the coverage job, which reports rather than enforcing a
    # threshold). Flip this to enforce a deny policy later via
    # `cargo audit --deny warnings` once the current advisories are triaged.
    # release.yml attaches the same report to every release.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.3.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run cargo audit
        # Exits non-zero when vulnerabilities (not just warnings) are found -
        # capture that in the job summary instead of failing the step, since
        # this job is informational.
        run: |
          set -o pipefail
          cargo audit | tee audit-output.txt || true

      - name: Publish audit results to the job summary
        run: |
          {
            echo "## Dependency audit (cargo-audit)"
            echo
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
