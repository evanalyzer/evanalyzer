name: CI

# Runs the test suite (+ coverage) on every push to main/beta-fix and every
# pull request. Separate from release.yml (which only builds release
# binaries on a version tag) so PRs never trigger the expensive
# multi-platform/CUDA release matrix.
#
# beta-fix is listed alongside main so this workflow can be verified end to
# end before it's relied on - the coverage badge/history commit step further
# below still only fires on main, not on beta-fix.
on:
  push:
    branches: ["main", "beta-fix"]
    # Excludes the bot's own badge/history commits from re-triggering this
    # workflow - without this, those commits used `[skip ci]` instead, but
    # GitHub's skip-ci applies to every push/pull_request-triggered workflow
    # run on that commit, on any ref: tagging that same commit for a release
    # later silently skipped release.yml's tag-push trigger too. paths-ignore
    # gets the same loop-prevention without touching the commit message.
    paths-ignore:
      - "docs/coverage-badge.svg"
      - "docs/coverage-history.csv"
      - "docs/audit-badge.svg"
      - "docs/audit-history.csv"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux CPU only, per the beta-readiness review: it's enough to gate
    # merges, and avoids paying for CUDA/Windows/macOS runners on every push.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    # `contents: write` is only used by the last step (committing the
    # coverage badge/history back to `main`) - everything else only reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        # The toolchain image runs workflow steps as a different user than
        # the one actions/checkout ran as on the host, so git's ownership
        # check (safe.directory) refuses every git command in this job -
        # including `git rev-parse --short HEAD` in the coverage-badge step
        # below, which then silently produces an empty SHA. Needed in every
        # job that uses this container, not just this one.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-test

      - name: Download native dependencies (libtorch CPU)
        # The `ai` (libtorch) feature is force-enabled workspace-wide - see
        # the comment on `evanalyzer_core` in the root Cargo.toml - so a
        # plain `cargo test` needs libtorch present even though this job
        # never asks for `--features ai` explicitly. DuckDB does not need a
        # download on Linux: crates/core/Cargo.toml enables its `bundled`
        # feature for `cfg(target_os = "linux")`, so it's compiled from
        # source instead.
        run: ./libs/download.sh linux-cpu

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage instrumentation
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/libs/libtorch/lib
        run: cargo llvm-cov --workspace --no-report

      - name: Generate coverage reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Publish coverage to the job summary
        run: |
          {
            echo "## Code coverage"
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/html/

      - name: Update coverage badge & history (push to main only)
        # Pull requests only get the job summary above - the badge/history
        # commit is reserved for main so a PR's own coverage run never
        # pushes to the branch it's testing.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          # Line coverage is the 10th whitespace-separated field of the
          # TOTAL row (header: Regions/Missed/Cover, Functions/Missed/Exec,
          # Lines/Missed/Cover, Branches/Missed/Cover).
          PCT=$(awk '/^TOTAL/ {print $10}' coverage-summary.txt | tr -d '%')
          bash .github/scripts/update_coverage_badge.sh "${PCT}" "$(git rev-parse --short HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage-badge.svg docs/coverage-history.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage badge"
            # The `audit` job commits its own badge to main from the same
            # workflow run, in parallel - whichever of the two pushes second
            # would otherwise be rejected as non-fast-forward. Rebase onto
            # the latest main and retry rather than serializing the jobs.
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt ${i}) - rebasing onto latest main and retrying..."
              git fetch origin main
              git rebase origin/main
            done
          else
            echo "Coverage unchanged - nothing to commit."
          fi

  fmt:
    # Checks that source is `cargo fmt`-clean, including the files
    # `evanalyzer_cfg`'s build.rs (re-)generates - see
    # crates/cfg/build/pipeline_commands_generator.rs - which writes
    # crates/cfg/src/modules/pipeline_command*.rs and
    # crates/core/src/job/algos_from_config.rs, running each through
    # `rustfmt` itself as part of generation.
    #
    # A plain checkout isn't enough to check those files correctly: the
    # committed copies could be stale relative to the algo structs they're
    # derived from, so this builds `evanalyzer_cfg` first to regenerate
    # them before running `cargo fmt --check` against the result.
    # `evanalyzer_cfg` has no native dependencies (it doesn't depend on
    # evanalyzer_core), so this is cheap and doesn't need the libtorch/JRE
    # downloads the `test` job pays for.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-fmt

      - name: Regenerate build-script-generated source
        run: cargo check -p evanalyzer_cfg

      - name: Check formatting
        run: cargo fmt --check

  templates:
    # Templates (`.evapipe`/`.evapt`) live in a separate repository
    # (evanalyzer/evanalyzer-templates), not this one - see release.yml's
    # "templates" job for how they're fetched/shipped. This checks every
    # template there - not just the subset release.yml actually ships -
    # still deserializes as PipelineTemplate/ProjectTemplate under this
    # repo's current schema (crates/cfg/examples/check_templates.rs),
    # catching a schema change breaking published templates as early as a
    # push/PR here, rather than only at release time.
    #
    # `evanalyzer_cfg` has no native dependencies, so - like `fmt` - this
    # doesn't need the libtorch/JRE downloads the `test` job pays for.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-check-templates

      - name: Fetch every template (partial clone - no example images downloaded)
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/evanalyzer/evanalyzer-templates.git evanalyzer-templates
          git -C evanalyzer-templates sparse-checkout set --no-cone '*.evapipe' '*.evapt'

      - name: Check every template against the current schema
        run: cargo run -p evanalyzer_cfg --example check_templates -- evanalyzer-templates

  audit:
    # Dependency/license audit via cargo-audit (RUSTSEC advisory DB). Only
    # needs Cargo.lock, not a full build, so it's a separate lightweight job
    # rather than a step tacked onto `test` - no libtorch/JRE download, no
    # compilation.
    #
    # Informational, not a merge gate: it doesn't fail the job on findings
    # (mirrors the coverage job, which reports a badge rather than enforcing
    # a threshold). Flip this to enforce a MSRV/deny policy later via
    # `cargo audit --deny warnings` once the current advisories are triaged.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    # `contents: write` is only used by the last step (committing the audit
    # badge/history back to `main`) - everything else only reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run cargo audit
        # Exits non-zero when vulnerabilities (not just warnings) are found -
        # capture that in the job summary instead of failing the step, since
        # this job is informational. Two invocations (plain + --json): the
        # plain-text one drives the human-readable job summary and the
        # badge's counts, the JSON one feeds write_audit_history.py the
        # per-crate/advisory detail the plain text doesn't structure cleanly.
        run: |
          set -o pipefail
          cargo audit | tee audit-output.txt || true
          cargo audit --json > audit-output.json || true

      - name: Publish audit results to the job summary
        run: |
          {
            echo "## Dependency audit (cargo-audit)"
            echo
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update audit badge & history (push to main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          VULNS=$(grep -oP '(?<=error: )\d+(?= vulnerabilit)' audit-output.txt || echo 0)
          WARNINGS=$(grep -oP '(?<=warning: )\d+(?= allowed warning)' audit-output.txt || echo 0)
          bash .github/scripts/update_audit_badge.sh "${VULNS}" "${WARNINGS}"
          python3 .github/scripts/write_audit_history.py audit-output.json "$(git rev-parse --short HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/audit-badge.svg docs/audit-history.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: update audit badge"
            # The `test` job commits its own badge to main from the same
            # workflow run, in parallel - whichever of the two pushes second
            # would otherwise be rejected as non-fast-forward. Rebase onto
            # the latest main and retry rather than serializing the jobs.
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt ${i}) - rebasing onto latest main and retrying..."
              git fetch origin main
              git rebase origin/main
            done
          else
            echo "Audit result unchanged - nothing to commit."
          fi
