name: Build & Package

on:
  push:
    # Matches version tags with or without a "v" prefix (v0.1.1 and 0.1.1
    # both trigger a release build) - anything starting with a digit or
    # "v<digit>" followed by anything else.
    tags: ["v[0-9]+.*", "[0-9]+.*"]
    # Test runs of the whole pipeline: built and packed like a release,
    # but nothing is signed or published (signing runs on tags only).
    branches: ["pipeline_start"]
  # A manual run started on a release tag ("Use workflow from" → the tag)
  # signs and publishes like the tag push; on a branch it's a test run.
  workflow_dispatch:

# Read-only by default. Write access only where a job adds files to the
# GitHub release (see "Create the GitHub release" in the templates job).
permissions:
  contents: read

defaults:
  run:
    # Container jobs otherwise run steps under `sh`, where the `[[ … ]]` in
    # "Set version" fails and every container build came out as 0.0.0-dev.
    shell: bash

jobs:
  verify-tag:
    # First on a release tag: is the tag signed with a key in TAG_SIGNERS
    # (variable of the `release` environment)? If not, nothing else runs -
    # no build, no GitHub release (templates and so every job waits for
    # this one). Skipped on test runs (pipeline_start, a manual run on a
    # branch). Fetches only the tag; nothing of the repository runs here.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - &check-tag-signature
        name: Check the tag's signature
        # Only the tag (and its commit, depth 1) is fetched into an empty
        # repository - no checkout of the tree. A lightweight (unsigned)
        # tag fails here too: verify-tag needs a signed tag object.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SIGNERS: ${{ vars.TAG_SIGNERS }}
        run: |
          if [ -z "$TAG_SIGNERS" ]; then
            echo "::error::The TAG_SIGNERS variable is not set in the 'release' environment."
            exit 1
          fi
          signers="$PWD/allowed_signers"
          git init -q tag-check
          cd tag-check
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch -q --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "+${GITHUB_REF}:${GITHUB_REF}"
          # One allowed key per line of TAG_SIGNERS.
          printf '%s\n' "$TAG_SIGNERS" | sed -e '/^[[:space:]]*$/d' -e 's/^/release namespaces="git" /' > "$signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signers" verify-tag "${GITHUB_REF}" || {
            echo "::error::${GITHUB_REF_NAME} is not signed with a key in TAG_SIGNERS - nothing is signed."
            exit 1
          }
          # The name inside the signed tag is the pushed one: an old signed
          # tag can't be pushed again under a new name.
          name=$(git cat-file tag "${GITHUB_REF}" | sed -n 's/^tag //p' | head -1)
          [ "$name" = "$GITHUB_REF_NAME" ] || {
            echo "::error::The signed tag is named '$name', but was pushed as ${GITHUB_REF_NAME}."
            exit 1
          }
          tagged=$(git rev-parse "${GITHUB_REF}^{commit}")
          [ "$tagged" = "$GITHUB_SHA" ] || {
            echo "::error::${GITHUB_REF_NAME} points at $tagged, but this run built $GITHUB_SHA."
            exit 1
          }
          echo "${GITHUB_REF_NAME}: signed with a key in TAG_SIGNERS, commit $GITHUB_SHA"

  templates:
    # Templates now live in evanalyzer/evanalyzer-templates, not this repo.
    # Fetched once here (rather than in every build-* job below) and shared
    # as an artifact, so the platform builds don't each pay for their own
    # clone. Only files under an "evanalyzer/" folder ship with the app -
    # the other top-level folders (e.g. cp_example_*) are worked examples
    # with their own bundled sample images and are meant to be browsed in
    # that repo, not shipped in the app's template picker.
    #
    # The partial clone (--filter=blob:none) plus a non-cone sparse-checkout
    # pattern means the example images are never even fetched, not just
    # filtered out afterwards - the server never sends those blobs.
    #
    # Every fetched template is also checked to be usable with this repo's
    # code before anything is uploaded - readable, made into a project as
    # the app does, checked as the editor checks it, its run's job made and
    # a preview run on the fixture image (see
    # crates/app/examples/check_templates.rs). A failure here fails this job, which
    # blocks every build-* job below (needs: [templates]) and the release
    # itself - no need for a separate scheduled check, since "before the
    # project is built and before it's released" is exactly this point.
    # Exception: on a test tag (e.g. 0.1.0-test.11) a failed check is only
    # reported as a warning and the builds go on.
    needs: [verify-tag]
    # Success, or skipped (not a tag) - never after a failed tag check.
    if: ${{ !cancelled() && needs.verify-tag.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the GitHub release
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history and tags for the release notes below.
          fetch-depth: 0

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the tag is a valid version
        # Every build-* job writes the tag into Cargo.toml with
        # `cargo set-version`, which rejects anything that isn't semver
        # (e.g. "1.0-beta"). Checked here, before the GitHub release below
        # is created, so a bad tag fails at once instead of leaving an
        # empty release behind.
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo set-version --workspace --dry-run "${GITHUB_REF_NAME#v}"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-x86_64-check-templates

      - name: Fetch templates
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/evanalyzer/evanalyzer-templates.git evanalyzer-templates
          git -C evanalyzer-templates sparse-checkout set --no-cone \
            '**/evanalyzer/*.evatemplate' '**/evanalyzer/*.evamodule'
          mkdir templates
          find evanalyzer-templates -type f \( -name '*.evatemplate' -o -name '*.evamodule' \) -exec cp -t templates {} +

      # Blocking for real releases. On a test tag (e.g. 0.1.0-test.11) a
      # failure is only reported (step below) and the builds still run.
      - name: Check templates are usable
        id: check_templates
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-test.') }}
        run: >-
          cargo run --locked -p evanalyzer_app --example check_templates --
          templates --image crates/core/tests/multi-channel-4D-series.ome.tif

      - name: Report template check failure (test tag - not blocking)
        if: steps.check_templates.outcome == 'failure'
        run: |
          echo "::warning title=Template check failed::Some templates aren't usable with this version (see the step above). Not blocking because ${GITHUB_REF_NAME} is a test tag."
          echo "### :warning: Template check failed (not blocking on test tag \`${GITHUB_REF_NAME}\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: templates
          path: templates/

      # Created here, before any build starts: each build-* job then adds
      # its own files the moment it's done, so users can download the
      # finished platforms while others are still building - or failed.
      # From the feat/perf/fix commits since the previous version tag (see
      # the script). The build-* jobs below upload files without a body, so
      # the notes stay - and can be edited on GitHub afterwards.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          # Any pre-release version (1.0.0-beta.1, 0.1.0-test.11, ...) is
          # marked as such, so it never shows up as the "Latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-linux:
    needs: [templates]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # adds its files to the GitHub release
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-x86_64

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          cargo set-version --workspace "${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh linux-cpu

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Build
        # The app, then the libtorch plugin it loads on the first AI step
        # (evanalyzer_ai as a cdylib with its `torch` engine - in a
        # separate command, so the app itself never links libtorch).
        run: |
          cargo build-linux --locked
          cargo build-ai-plugin --release --target x86_64-unknown-linux-gnu --locked

      - name: Download templates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          # Our license and every third-party license text (NVIDIA's terms ask
          # for theirs to travel with the libraries, not only in the About dialog).
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/
          cp target/x86_64-unknown-linux-gnu/release/evanalyzer   dist/
          # The AI plugin with its libtorch in ai/cpu: the plugin's $ORIGIN
          # rpath (see .cargo/config.toml) finds them there. The glob must be
          # *.so* (not *.so) to include versioned deps like
          # libgomp-<hash>.so.1 that libtorch_cpu.so requires.
          mkdir -p dist/ai/cpu
          cp target/x86_64-unknown-linux-gnu/release/libevanalyzer_ai.so dist/ai/cpu/
          cp libs/libtorch/lib/*.so*                               dist/ai/cpu/ 2>/dev/null || true
          tar -czf evanalyzer-linux-x86_64.tar.gz -C dist .

      - name: Check the oldest glibc it runs on
        # Every program and library in the package must run with glibc
        # 2.39 (Ubuntu 24.04+, Debian 13+, Fedora 40+, RHEL 10+ - see the
        # download page). Fails when the toolchain image moved to a newer
        # base and raised that floor unnoticed.
        run: bash .github/scripts/check-glibc.sh 2.39 dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evanalyzer-linux-x86_64
          path: evanalyzer-linux-x86_64.tar.gz

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: evanalyzer-linux-x86_64.tar.gz

      # The command line, server and worker without the desktop app (no
      # font or display libraries): for servers and compute clusters. After
      # the package above - it overwrites target/…/release/evanalyzer.
      - name: Build the command-line version
        run: cargo build-linux-cli --locked

      - name: Package the command-line version
        run: |
          mkdir -p dist-cli
          cp LICENSE THIRD-PARTY-NOTICES.txt dist-cli/
          cp target/x86_64-unknown-linux-gnu/release/evanalyzer dist-cli/
          cp -r dist/ai dist/templates dist-cli/
          tar -czf evanalyzer-cli-linux-x86_64.tar.gz -C dist-cli .

      - name: Check the oldest glibc the command-line version runs on
        run: bash .github/scripts/check-glibc.sh 2.39 dist-cli

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evanalyzer-cli-linux-x86_64
          path: evanalyzer-cli-linux-x86_64.tar.gz

      - name: Add the command-line version to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: evanalyzer-cli-linux-x86_64.tar.gz

  build-windows:
    needs: [templates]
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-x86_64

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          cargo set-version --workspace "${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh win-cpu

      - name: Unzip DuckDB Windows library
        run: unzip -q libs/libduckdb-windows-amd64.zip -d libs/libduckdb-windows-amd64

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Work around torch-sys clang-cl define bug
        # torch-sys 0.24.0 hands clang-cl an MSBuild property
        # (/p:DefineConstants=GLOG_USE_GLOG_EXPORT) instead of a /D define, which
        # clang-cl rejects as a missing input file (its Linux/macOS path uses the
        # correct -DGLOG_USE_GLOG_EXPORT). Shim clang-cl on PATH to rewrite just
        # that one argument to /DGLOG_USE_GLOG_EXPORT. POSIX sh only - the
        # toolchain container has no bash (steps run under `sh`).
        run: |
          mkdir -p "$HOME/ccshim"
          cat > "$HOME/ccshim/clang-cl" <<'EOF'
          #!/bin/sh
          # Locate the real clang-cl: first one on PATH that isn't this shim.
          selfdir=$(cd "$(dirname "$0")" && pwd)
          real=
          IFS=:
          for d in $PATH; do
            if [ "$d" != "$selfdir" ] && [ -x "$d/clang-cl" ]; then real="$d/clang-cl"; break; fi
          done
          unset IFS
          # Rebuild the argument list, swapping the bad flag for the real define.
          n=0
          for a in "$@"; do
            if [ "$a" = "/p:DefineConstants=GLOG_USE_GLOG_EXPORT" ]; then
              set -- "$@" "/DGLOG_USE_GLOG_EXPORT"
            else
              set -- "$@" "$a"
            fi
            n=$((n + 1))
          done
          shift "$n"
          exec "$real" "$@"
          EOF
          chmod +x "$HOME/ccshim/clang-cl"
          echo "$HOME/ccshim" >> "$GITHUB_PATH"

      - name: Build
        # The app, then the libtorch plugin it loads on the first AI step.
        run: |
          cargo build-win --locked
          cargo xwin rustc -p evanalyzer_ai --features torch --crate-type cdylib --release --target x86_64-pc-windows-msvc

      - name: Download templates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          # Our license and every third-party license text (NVIDIA's terms ask
          # for theirs to travel with the libraries, not only in the About dialog).
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/
          cp target/x86_64-pc-windows-msvc/release/evanalyzer.exe dist/
          cp libs/libduckdb-windows-amd64/duckdb.dll           dist/
          # The AI plugin with its libtorch in ai\cpu - the app loads it with
          # its own folder searched first (LOAD_LIBRARY_SEARCH_DLL_LOAD_DIR).
          mkdir -p dist/ai/cpu
          cp target/x86_64-pc-windows-msvc/release/evanalyzer_ai.dll dist/ai/cpu/
          cp libs/libtorch/lib/*.dll                           dist/ai/cpu/

      # Not packed here: package-windows packs it, on release tags with the
      # signed exe and plugin from sign-windows.
      - name: Upload the build for packing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build-x86_64
          path: dist/
          retention-days: 1

      - name: Upload the files to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-x86_64
          path: |
            dist/evanalyzer.exe
            dist/ai/cpu/evanalyzer_ai.dll
          retention-days: 1

  build-linux-cuda:
    needs: [templates]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # adds its files to the GitHub release
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-x86_64-cuda

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          cargo set-version --workspace "${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh linux-cuda

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Build
        # The app, then the libtorch plugin it loads on the first AI step
        # (evanalyzer_ai as a cdylib with its `torch` engine - in a
        # separate command, so the app itself never links libtorch).
        run: |
          cargo build-linux --locked
          cargo build-ai-plugin --release --target x86_64-unknown-linux-gnu --locked

      - name: Download templates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          # Our license and every third-party license text (NVIDIA's terms ask
          # for theirs to travel with the libraries, not only in the About dialog).
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/
          cp target/x86_64-unknown-linux-gnu/release/evanalyzer   dist/
          # The AI plugin with its CUDA libtorch in ai/cuda (it runs on the CPU
          # too where there is no GPU), and beside it the NVIDIA libraries
          # libtorch needs - its zip has none, they come from NVIDIA's wheels
          # (see libs/download.sh). Most are versioned objects
          # (libcudart.so.13, libcudnn*.so.9, libgomp.so.1, …), so the globs
          # must be *.so* - a plain *.so would ship none of them and the
          # plugin would fail to load.
          mkdir -p dist/ai/cuda
          cp target/x86_64-unknown-linux-gnu/release/libevanalyzer_ai.so dist/ai/cuda/
          cp libs/libtorch/lib/*.so*                               dist/ai/cuda/ 2>/dev/null || true
          cp libs/nvidia-cu13/lib/*.so*                            dist/ai/cuda/
          # Drop LibTorch components this app never reaches regardless of
          # which model is loaded (Python bindings, distributed/profiling/
          # GPUDirect libs, PyTorch's own test fixtures, the Android
          # backend) - see .github/NOT_SHIP_LIST.txt for why each entry is
          # safe. Deliberately conservative: cuDNN's dlopen'd plugins and
          # anything TorchScript's automatic op fusion could reach are kept.
          # Patterns must stay unquoted so the shell glob-expands them (most
          # entries carry a version hash, e.g. libnvshmem_host-<hash>.so.3);
          # the -e guard skips a pattern that matched nothing instead of
          # trying to rm a literal, non-existent "*" filename.
          while IFS= read -r pattern; do
            case "$pattern" in ""|"#"*) continue ;; esac
            for f in dist/ai/cuda/$pattern; do
              [ -e "$f" ] && rm -f "$f"
            done
          done < .github/NOT_SHIP_LIST.txt
          # CUDA is libtorch_cuda, loaded by the app beside the plugin (it
          # registers itself - nothing links it): without it the build runs
          # CPU-only.
          [ -f dist/ai/cuda/libtorch_cuda.so ] || { echo "::error::dist/ai/cuda/libtorch_cuda.so missing - the CUDA build would run CPU-only"; exit 1; }
          # Every library libtorch's CUDA part needs is in the package (its
          # RUNPATH is $ORIGIN) - a missing one only shows on a user's GPU
          # machine. libtorch_cuda_linalg is opened on the first GPU linear-
          # algebra op. Not the driver's own (libcuda, NVML): they come with
          # the user's NVIDIA driver.
          for lib in libtorch_cuda.so libtorch_cuda_linalg.so; do
            if ldd "dist/ai/cuda/$lib" | grep "not found" | grep -v -e "libcuda\.so" -e "libnvidia-ml\.so"; then
              echo "::error::libraries $lib needs are missing from dist/ai/cuda"; exit 1
            fi
          done
          # 7-Zip at maximum compression (-mx=9) keeps it one file below
          # GitHub's 2 GiB release asset limit.
          ( cd dist && 7z a -t7z -mx=9 ../evanalyzer-linux-x86_64-cuda.7z . )
          size=$(stat -c %s evanalyzer-linux-x86_64-cuda.7z)
          echo "evanalyzer-linux-x86_64-cuda.7z: $((size / 1048576)) MiB"
          [ "$size" -lt 2147483648 ] || { echo "::error::evanalyzer-linux-x86_64-cuda.7z is over GitHub's 2 GiB release asset limit"; exit 1; }

      - name: Check the oldest glibc it runs on
        # Every program and library in the package must run with glibc
        # 2.39 (Ubuntu 24.04+, Debian 13+, Fedora 40+, RHEL 10+ - see the
        # download page). Fails when the toolchain image moved to a newer
        # base and raised that floor unnoticed.
        run: bash .github/scripts/check-glibc.sh 2.39 dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evanalyzer-linux-x86_64-cuda
          path: evanalyzer-linux-x86_64-cuda.7z

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: evanalyzer-linux-x86_64-cuda.7z

      # The command line, server and worker without the desktop app, with
      # the CUDA plugin: for GPU compute clusters without a desktop. After
      # the package above - it overwrites target/…/release/evanalyzer.
      - name: Build the command-line version
        run: cargo build-linux-cli --locked

      - name: Package the command-line version
        run: |
          mkdir -p dist-cli
          cp LICENSE THIRD-PARTY-NOTICES.txt dist-cli/
          cp target/x86_64-unknown-linux-gnu/release/evanalyzer dist-cli/
          # ai/cuda as packaged above (already without the NOT_SHIP_LIST).
          cp -r dist/ai dist/templates dist-cli/
          # tar.xz, not 7z: unpacks with plain tar on servers without 7-Zip.
          # xz at its highest level keeps it below GitHub's 2 GiB limit like
          # the 7z above.
          tar -I 'xz -9 -T0' -cf evanalyzer-cli-linux-x86_64-cuda.tar.xz -C dist-cli .
          size=$(stat -c %s evanalyzer-cli-linux-x86_64-cuda.tar.xz)
          echo "evanalyzer-cli-linux-x86_64-cuda.tar.xz: $((size / 1048576)) MiB"
          [ "$size" -lt 2147483648 ] || { echo "::error::evanalyzer-cli-linux-x86_64-cuda.tar.xz is over GitHub's 2 GiB release asset limit"; exit 1; }

      - name: Check the oldest glibc the command-line version runs on
        run: bash .github/scripts/check-glibc.sh 2.39 dist-cli

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evanalyzer-cli-linux-x86_64-cuda
          path: evanalyzer-cli-linux-x86_64-cuda.tar.xz

      - name: Add the command-line version to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: evanalyzer-cli-linux-x86_64-cuda.tar.xz

  build-windows-cuda:
    needs: [templates]
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-x86_64-cuda

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          cargo set-version --workspace "${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh win-cuda

      - name: Unzip DuckDB Windows library
        run: unzip -q libs/libduckdb-windows-amd64.zip -d libs/libduckdb-windows-amd64

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Work around torch-sys clang-cl define bug
        # torch-sys 0.24.0 hands clang-cl an MSBuild property
        # (/p:DefineConstants=GLOG_USE_GLOG_EXPORT) instead of a /D define, which
        # clang-cl rejects as a missing input file (its Linux/macOS path uses the
        # correct -DGLOG_USE_GLOG_EXPORT). Shim clang-cl on PATH to rewrite just
        # that one argument to /DGLOG_USE_GLOG_EXPORT. POSIX sh only - the
        # toolchain container has no bash (steps run under `sh`).
        run: |
          mkdir -p "$HOME/ccshim"
          cat > "$HOME/ccshim/clang-cl" <<'EOF'
          #!/bin/sh
          # Locate the real clang-cl: first one on PATH that isn't this shim.
          selfdir=$(cd "$(dirname "$0")" && pwd)
          real=
          IFS=:
          for d in $PATH; do
            if [ "$d" != "$selfdir" ] && [ -x "$d/clang-cl" ]; then real="$d/clang-cl"; break; fi
          done
          unset IFS
          # Rebuild the argument list, swapping the bad flag for the real define.
          n=0
          for a in "$@"; do
            if [ "$a" = "/p:DefineConstants=GLOG_USE_GLOG_EXPORT" ]; then
              set -- "$@" "/DGLOG_USE_GLOG_EXPORT"
            else
              set -- "$@" "$a"
            fi
            n=$((n + 1))
          done
          shift "$n"
          exec "$real" "$@"
          EOF
          chmod +x "$HOME/ccshim/clang-cl"
          echo "$HOME/ccshim" >> "$GITHUB_PATH"

      - name: Build
        # The app, then the libtorch plugin it loads on the first AI step.
        run: |
          cargo build-win --locked
          cargo xwin rustc -p evanalyzer_ai --features torch --crate-type cdylib --release --target x86_64-pc-windows-msvc

      - name: Download templates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          # Our license and every third-party license text (NVIDIA's terms ask
          # for theirs to travel with the libraries, not only in the About dialog).
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/
          cp target/x86_64-pc-windows-msvc/release/evanalyzer.exe dist/
          cp libs/libduckdb-windows-amd64/duckdb.dll           dist/
          # The AI plugin with its CUDA libtorch in ai\cuda.
          mkdir -p dist/ai/cuda
          cp target/x86_64-pc-windows-msvc/release/evanalyzer_ai.dll dist/ai/cuda/
          cp libs/libtorch/lib/*.dll                           dist/ai/cuda/
          # Drop LibTorch components this app never reaches regardless of
          # which model is loaded - see .github/NOT_SHIP_LIST.txt for why
          # each entry is safe (and what's deliberately kept: cuDNN's
          # dlopen'd plugins, anything TorchScript's automatic op fusion
          # could reach). Patterns must stay unquoted so the shell
          # glob-expands them; the -e guard skips a pattern that matched
          # nothing instead of trying to rm a literal "*" filename.
          while IFS= read -r pattern; do
            case "$pattern" in ""|"#"*) continue ;; esac
            for f in dist/ai/cuda/$pattern; do
              [ -e "$f" ] && rm -f "$f"
            done
          done < .github/NOT_SHIP_LIST.txt
          # CUDA is libtorch_cuda, loaded by the app beside the plugin (it
          # registers itself - nothing links it): without it the build runs
          # CPU-only.
          [ -f dist/ai/cuda/torch_cuda.dll ] || { echo "::error::dist/ai/cuda/torch_cuda.dll missing - the CUDA build would run CPU-only"; exit 1; }

      # Not packed here: package-windows packs it, on release tags with the
      # signed exe and plugin from sign-windows.
      - name: Upload the build for packing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build-x86_64-cuda
          path: dist/
          retention-days: 1

      - name: Upload the files to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-x86_64-cuda
          path: |
            dist/evanalyzer.exe
            dist/ai/cuda/evanalyzer_ai.dll
          retention-days: 1

  build-macos:
    needs: [templates]
    runs-on: macos-15   # Apple Silicon (arm64); macos-14 retired 2026-11-02
    permissions:
      contents: write   # adds its files to the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-arm64

      - name: Install cargo-edit
        # Runs on the macOS runner, not in the toolchain image, so
        # `cargo set-version` (below) isn't preinstalled here.
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-edit@0.13.14   # as in the toolchain image

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          cargo set-version --workspace "${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh mac-cpu

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Unzip DuckDB macOS library
        run: unzip -q libs/libduckdb-osx-universal.zip -d libs/libduckdb-osx-universal

      - name: Build
        env:
          # DuckDB is not bundled on macOS; point libduckdb-sys at the prebuilt lib.
          DUCKDB_LIB_DIR: ${{ github.workspace }}/libs/libduckdb-osx-universal
          DUCKDB_INCLUDE_DIR: ${{ github.workspace }}/libs/libduckdb-osx-universal
        run: |
          cargo build-mac --locked
          cargo build-ai-plugin --release --target aarch64-apple-darwin --locked

      - name: Download templates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # Our license and every third-party license text (NVIDIA's terms ask
          # for theirs to travel with the libraries, not only in the About dialog).
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/
          cp target/aarch64-apple-darwin/release/evanalyzer       dist/
          # DuckDB next to the binary; the AI plugin with its libtorch in
          # ai/cpu (loaded on the first AI step).
          cp libs/libduckdb-osx-universal/*.dylib                  dist/ 2>/dev/null || true
          mkdir -p dist/ai/cpu
          cp target/aarch64-apple-darwin/release/libevanalyzer_ai.dylib dist/ai/cpu/
          cp libs/libtorch/lib/*.dylib                             dist/ai/cpu/ 2>/dev/null || true

          # ---- Make the bundle relocatable (adapted from the legacy mac packer) ----
          # libtorch's / DuckDB's dylibs and the binary reference each other by
          # their install names, which on a build machine are @rpath/... or
          # absolute paths that don't exist on a user's Mac. Each library
          # finds its neighbours in its own folder: rewrite every non-system
          # dependency to @executable_path (the binary) / @loader_path (the
          # dylibs) so it resolves wherever the folder is unzipped - no
          # install, just run.
          relink() {                       # relink <macho-file> <path-prefix> <folder>
            local file="$1" prefix="$2" dir="$3" dep base
            otool -L "$file" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                /System/*|/usr/lib/*) continue ;;
              esac
              base="$(basename "$dep")"
              if [ -f "$dir/$base" ]; then
                install_name_tool -change "$dep" "${prefix}/${base}" "$file" || true
              fi
            done
          }
          for dir in dist dist/ai/cpu; do
            for lib in "$dir"/*.dylib; do
              install_name_tool -id "@loader_path/$(basename "$lib")" "$lib" || true
              relink "$lib" "@loader_path" "$dir"
            done
          done
          relink dist/evanalyzer "@executable_path" dist

          # install_name_tool invalidates code signatures - re-sign ad-hoc so
          # macOS will load the rewritten binaries.
          for f in dist/evanalyzer dist/*.dylib dist/ai/cpu/*.dylib; do
            codesign --force --sign - "$f"
          done

          # First-run instructions for end users (Gatekeeper quarantine).
          cat > dist/README.txt <<'EOF'
          EVAnalyzer for macOS (Apple Silicon)
          ====================================

          This build is ad-hoc signed but NOT notarized, so after you download it
          macOS Gatekeeper will quarantine it. To run it:

            1. Open Terminal in this folder.
            2. Clear the quarantine flag (only needed once):
                 xattr -dr com.apple.quarantine evanalyzer
            3. Start the app:
                 ./evanalyzer

          Keep every file in this folder together - the bundled libraries
          (*.dylib, and the AI plugin in ai/cpu) are resolved relative to the
          `evanalyzer` binary.
          EOF

          tar -czf evanalyzer-macos-arm64.tar.gz -C dist .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evanalyzer-macos-arm64
          path: evanalyzer-macos-arm64.tar.gz

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: evanalyzer-macos-arm64.tar.gz

