  sign-windows:
    # Authenticode-signs our own exe and AI plugin of every Windows build
    # with the Certum SimplySign cloud certificate; the third-party DLLs
    # (DuckDB, libtorch) stay as their vendors ship them.
    #
    # Only on release tags, and only in the `release` environment: it
    # holds the CERTUM_* secrets and the TAG_SIGNERS variable and accepts
    # release tags only. The tag must be signed with a key in TAG_SIGNERS
    # (the owner's release key on a YubiKey: `git tag -s -u <key>.pub`) and
    # point at the commit this run built - a tag pushed with a stolen
    # GitHub login alone signs nothing.
    # Nothing of the repository runs next to the secret: no checkout, no
    # build, no build script of any dependency - only the tag object is
    # fetched (to check its signature, nothing of it runs) and the two
    # unsigned files per build come in and go out signed, with tools from
    # the pinned toolchain image.
    #
    # One job for all Windows builds: the logins one after another
    # (SimplySign may refuse the same one-time code twice).
    # `!cancelled()`: one failed Windows build doesn't stop the others.
    needs: [templates, build-windows, build-windows-cuda, build-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.templates.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      # The same check as in verify-tag, right next to the secret: signing
      # never relies on another job having checked.
      - *check-tag-signature

      # One folder per build: windows/windows-unsigned-<build>/…
      - name: Download the files to sign
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-unsigned-*
          path: windows

      - name: Sign
        # ssign derives the login code from the TOTP seed, so this runs
        # unattended. A refused code is retried once the next one is out (a
        # new one every 30 s); one file per call, so a retry never signs an
        # already signed file again.
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          if [ -z "$CERTUM_EMAIL" ] || [ -z "$CERTUM_OTP" ]; then
            echo "::error::The CERTUM_EMAIL / CERTUM_OTP secrets are not set in the 'release' environment."
            exit 1
          fi
          shopt -s nullglob
          files=(windows/*/evanalyzer.exe windows/*/ai/*/evanalyzer_ai.dll)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No Windows build to sign."; exit 1; }
          for file in "${files[@]}"; do
            before=$(sha256sum < "$file")
            for attempt in 1 2 3; do
              ssign --name EVAnalyzer "$file" && break
              [ "$attempt" = 3 ] && exit 1
              sleep 35
            done
            [ "$(sha256sum < "$file")" != "$before" ] || { echo "::error::$file is unchanged after signing."; exit 1; }
            echo "signed $file"
          done

      - name: Upload the signed files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-signed
          path: windows/
          retention-days: 1

  package-windows:
    # One download per Windows build with everything in it: zip, or 7z at
    # maximum compression for CUDA (keeps it below GitHub's 2 GiB release
    # asset limit). On a release tag with the signed exe and plugin from
    # sign-windows - a release is never packed unsigned; on other runs
    # (pipeline_start, a manual run on a branch) unsigned.
    # Runs when sign-windows succeeded, or was skipped (not a tag).
    needs: [templates, build-windows, build-windows-cuda, build-windows-arm64, sign-windows]
    if: ${{ !cancelled() && needs.templates.result == 'success' && needs.sign-windows.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: x86_64
            archive: evanalyzer-windows-x86_64.zip
          - build: x86_64-cuda
            archive: evanalyzer-windows-x86_64-cuda.7z
          - build: arm64
            archive: evanalyzer-windows-arm64.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write   # adds its files to the GitHub release
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-build-${{ matrix.build }}
          path: dist

      - name: Download the signed files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-signed
          path: signed

      - name: Package
        env:
          BUILD: ${{ matrix.build }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            src="signed/windows-unsigned-${BUILD}"
            [ -f "$src/evanalyzer.exe" ] || { echo "::error::No signed files for ${BUILD} - a release is never packed unsigned."; exit 1; }
            cp -r "$src/." dist/
          fi
          case "$ARCHIVE" in
            *.zip) (cd dist && zip -qr "../$ARCHIVE" .) ;;
            *.7z)  (cd dist && 7z a -t7z -mx=9 "../$ARCHIVE" .) ;;
          esac
          size=$(stat -c %s "$ARCHIVE")
          echo "$ARCHIVE: $((size / 1048576)) MiB"
          [ "$size" -lt 2147483648 ] || { echo "::error::$ARCHIVE is over GitHub's 2 GiB release asset limit"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evanalyzer-windows-${{ matrix.build }}
          path: ${{ matrix.archive }}

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ matrix.archive }}

  attest:
    # Provenance for every file of the release: a statement signed by
    # GitHub/Sigstore that exactly this file (its SHA-256) was built by this
    # workflow, in this repository, from this commit and tag - no key of
    # ours. Users check a download with
    #   gh attestation verify <file> -R evanalyzer/evanalyzer
    # and, without gh, against SHA256SUMS (added to the release here).
    #
    # Own job, after everything else: id-token (which can create
    # attestations) is never given to a job that runs build scripts of
    # dependencies. No checkout - only the finished files come in.
    # `!cancelled()`: the files of the builds that succeeded are attested.
    needs: [templates, build-linux, build-linux-cuda, build-macos, build-linux-arm64, package-windows, sbom, audit, coverage]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.templates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # adds SHA256SUMS to the GitHub release
      id-token: write       # Sigstore certificate for the attestations
      attestations: write   # stores them with the repository
    steps:
      # Every file the release got: the packages, SBOM, audit and coverage
      # reports (artifacts evanalyzer-*; the internal windows-* ones not).
      - name: Download the release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evanalyzer-*
          merge-multiple: true
          path: release

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: SHA256SUMS
        run: |
          (cd release && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS

      - name: Add to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: SHA256SUMS

  # The container images (docker.yml), from the Linux builds' command-line
  # packages.
  docker:
    needs: [build-linux, build-linux-cuda, build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      id-token: write       # attestations of the pushed images (see docker.yml)
      attestations: write
    with:
      version: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  sbom:
    # SBOM for the shipped `evanalyzer` binary (crates/bin), covering its full
    # dependency graph - workspace crates and third-party alike, ~800
    # components. One SBOM for the whole release: Cargo.lock (and so the
    # dependency graph cargo-cyclonedx reads) doesn't vary by target platform
    # or the CPU/CUDA feature split, so per-platform SBOMs would be
    # duplicates.
    needs: [templates]   # uploads into the release created there
    runs-on: ubuntu-latest
    permissions:
      contents: write   # adds its files to the GitHub release
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sbom

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          cargo set-version --workspace "${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --manifest-path crates/bin/Cargo.toml
          mv crates/bin/evanalyzer_bin.cdx.json evanalyzer-${VERSION}-sbom.cdx.json
          # The AI plugin (evanalyzer_ai with libtorch/tch) is its own
          # library, not linked into the app - its own SBOM.
          cargo cyclonedx --format json --manifest-path crates/ai/Cargo.toml --features torch
          mv crates/ai/evanalyzer_ai.cdx.json evanalyzer-ai-plugin-${VERSION}-sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evanalyzer-sbom
          path: evanalyzer-*-sbom.cdx.json

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: evanalyzer-*-sbom.cdx.json


  audit:
    # cargo-audit report for the release, attached next to the SBOM.
    # Informational like ci.yml's `audit` job: findings never fail the
    # release, they're documented in the attached report.
    needs: [templates]   # uploads into the release created there
    runs-on: ubuntu-latest
    permissions:
      contents: write   # adds its files to the GitHub release
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Run cargo audit
        # Exits non-zero when vulnerabilities are found - kept informational.
        # Plain text for people, JSON for tooling.
        run: |
          cargo audit > evanalyzer-${VERSION}-audit.txt || true
          cargo audit --json > evanalyzer-${VERSION}-audit.json || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evanalyzer-audit
          path: evanalyzer-*-audit.*

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: evanalyzer-*-audit.*

  coverage:
    # Test coverage of the released commit (cargo-llvm-cov), attached as
    # lcov plus a zipped HTML report. Runs the same instrumented test suite
    # as ci.yml's `test` job, in parallel with the platform builds.
    needs: [templates]   # uploads into the release created there
    runs-on: ubuntu-latest
    permissions:
      contents: write   # adds its files to the GitHub release
    container:
      image: joda001/evanalyzer-toolchain:0.3.2@sha256:b56ac9d19a5d1d4149eb71608286afe48af3f12ddb201ef5fbf9c4e155c34a9f
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-x86_64-coverage

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies (libtorch CPU)
        run: ./libs/download.sh linux-cpu

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Run tests with coverage instrumentation
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/libs/libtorch/lib
          # The instrumented build got OOM-killed (exit 137) on the runner.
          # Coverage needs no debug info, and fewer parallel rustc/linker
          # processes keep the peak below the runner's RAM.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        run: >-
          cargo llvm-cov --workspace --no-report --locked
          --features evanalyzer_core/libtorch,evanalyzer_core/libtorch-in-process

      - name: Generate coverage reports
        run: |
          cargo llvm-cov report --lcov --output-path evanalyzer-${VERSION}-coverage.lcov
          cargo llvm-cov report --html
          cargo llvm-cov report --summary-only > evanalyzer-${VERSION}-coverage-summary.txt
          (cd target/llvm-cov && zip -qr "../../evanalyzer-${VERSION}-coverage-html.zip" html)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evanalyzer-coverage
          path: evanalyzer-*-coverage*

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: evanalyzer-*-coverage*
