name: Build & Package

on:
  push:
    # Matches version tags with or without a "v" prefix (v0.1.1 and 0.1.1
    # both trigger a release build) - anything starting with a digit or
    # "v<digit>" followed by anything else.
    tags: ["v[0-9]+.*", "[0-9]+.*"]
    branches: ["pipeline_start"]
  workflow_dispatch:

# Every build job uploads its own files to the release (see "Create the
# GitHub release" in the templates job).
permissions:
  contents: write

defaults:
  run:
    # Container jobs otherwise run steps under `sh`, where the `[[ … ]]` in
    # "Set version" fails and every container build came out as 0.0.0-dev.
    shell: bash

jobs:
  templates:
    # Templates now live in evanalyzer/evanalyzer-templates, not this repo.
    # Fetched once here (rather than in every build-* job below) and shared
    # as an artifact, so the platform builds don't each pay for their own
    # clone. Only files under an "evanalyzer/" folder ship with the app -
    # the other top-level folders (e.g. cp_example_*) are worked examples
    # with their own bundled sample images and are meant to be browsed in
    # that repo, not shipped in the app's template picker.
    #
    # The partial clone (--filter=blob:none) plus a non-cone sparse-checkout
    # pattern means the example images are never even fetched, not just
    # filtered out afterwards - the server never sends those blobs.
    #
    # Every fetched template is also checked against this repo's current
    # ProjectTemplate/ModuleTemplate types before anything is uploaded -
    # see crates/cfg/examples/check_templates.rs for why that's stronger
    # than a generic JSON Schema check. A failure here fails this job, which
    # blocks every build-* job below (needs: [templates]) and the release
    # itself - no need for a separate scheduled check, since "before the
    # project is built and before it's released" is exactly this point.
    # Exception: on a test tag (e.g. 0.1.0-test.11) a failed check is only
    # reported as a warning and the builds go on.
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-check-templates

      - name: Fetch templates
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/evanalyzer/evanalyzer-templates.git evanalyzer-templates
          git -C evanalyzer-templates sparse-checkout set --no-cone \
            '**/evanalyzer/*.evatemplate' '**/evanalyzer/*.evamodule'
          mkdir templates
          find evanalyzer-templates -type f \( -name '*.evatemplate' -o -name '*.evamodule' \) -exec cp -t templates {} +

      # Blocking for real releases. On a test tag (e.g. 0.1.0-test.11) a
      # failure is only reported (step below) and the builds still run.
      - name: Check templates against the current schema
        id: check_templates
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-test.') }}
        run: cargo run -p evanalyzer_cfg --example check_templates -- templates

      - name: Report template check failure (test tag - not blocking)
        if: steps.check_templates.outcome == 'failure'
        run: |
          echo "::warning title=Template check failed::Some templates don't match the current schema (see the step above). Not blocking because ${GITHUB_REF_NAME} is a test tag."
          echo "### :warning: Template check failed (not blocking on test tag \`${GITHUB_REF_NAME}\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: templates
          path: templates/

      # Created here, before any build starts: each build-* job then adds
      # its own files the moment it's done, so users can download the
      # finished platforms while others are still building - or failed.
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Downloads are added one by one as each platform's build finishes.

            | Platform | Download | AI models (PyTorch) |
            |---|---|---|
            | Windows x86_64 | `evanalyzer-windows-x86_64.zip` | CPU |
            | Windows x86_64 + NVIDIA GPU | `evanalyzer-windows-x86_64-cuda.7z` | CUDA ¹ |
            | Windows ARM64 | `evanalyzer-windows-arm64.zip` | CPU |
            | Linux x86_64 | `evanalyzer-linux-x86_64.tar.gz` | CPU |
            | Linux x86_64 + NVIDIA GPU | `evanalyzer-linux-x86_64-cuda.7z` | CUDA ¹ |
            | Linux ARM64 | `evanalyzer-linux-arm64.tar.gz` | **not supported** - PyTorch publishes no libtorch for Linux ARM64 |
            | macOS Apple Silicon | `evanalyzer-macos-arm64.tar.gz` | CPU |

            ¹ NVIDIA GPUs from Turing on (RTX 20xx, GTX 16xx and newer) with driver 580 or newer. For older GPUs use the CPU download.

  build-linux:
    needs: [templates]
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh linux-cpu

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Build
        # The app, then the libtorch plugin it loads on the first AI step
        # (evanalyzer_ai as a cdylib with its `torch` engine - in a
        # separate command, so the app itself never links libtorch).
        run: |
          cargo build-linux
          cargo build-ai-plugin --release --target x86_64-unknown-linux-gnu

      - name: Download templates
        uses: actions/download-artifact@v4
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/evanalyzer   dist/
          # The AI plugin with its libtorch in ai/cpu: the plugin's $ORIGIN
          # rpath (see .cargo/config.toml) finds them there. The glob must be
          # *.so* (not *.so) to include versioned deps like
          # libgomp-<hash>.so.1 that libtorch_cpu.so requires.
          mkdir -p dist/ai/cpu
          cp target/x86_64-unknown-linux-gnu/release/libevanalyzer_ai.so dist/ai/cpu/
          cp libs/libtorch/lib/*.so*                               dist/ai/cpu/ 2>/dev/null || true
          tar -czf evanalyzer-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: evanalyzer-linux-x86_64
          path: evanalyzer-linux-x86_64.tar.gz

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: evanalyzer-linux-x86_64.tar.gz

  build-windows:
    needs: [templates]
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh win-cpu

      - name: Unzip DuckDB Windows library
        run: unzip -q libs/libduckdb-windows-amd64.zip -d libs/libduckdb-windows-amd64

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Work around torch-sys clang-cl define bug
        # torch-sys 0.24.0 hands clang-cl an MSBuild property
        # (/p:DefineConstants=GLOG_USE_GLOG_EXPORT) instead of a /D define, which
        # clang-cl rejects as a missing input file (its Linux/macOS path uses the
        # correct -DGLOG_USE_GLOG_EXPORT). Shim clang-cl on PATH to rewrite just
        # that one argument to /DGLOG_USE_GLOG_EXPORT. POSIX sh only - the
        # toolchain container has no bash (steps run under `sh`).
        run: |
          mkdir -p "$HOME/ccshim"
          cat > "$HOME/ccshim/clang-cl" <<'EOF'
          #!/bin/sh
          # Locate the real clang-cl: first one on PATH that isn't this shim.
          selfdir=$(cd "$(dirname "$0")" && pwd)
          real=
          IFS=:
          for d in $PATH; do
            if [ "$d" != "$selfdir" ] && [ -x "$d/clang-cl" ]; then real="$d/clang-cl"; break; fi
          done
          unset IFS
          # Rebuild the argument list, swapping the bad flag for the real define.
          n=0
          for a in "$@"; do
            if [ "$a" = "/p:DefineConstants=GLOG_USE_GLOG_EXPORT" ]; then
              set -- "$@" "/DGLOG_USE_GLOG_EXPORT"
            else
              set -- "$@" "$a"
            fi
            n=$((n + 1))
          done
          shift "$n"
          exec "$real" "$@"
          EOF
          chmod +x "$HOME/ccshim/clang-cl"
          echo "$HOME/ccshim" >> "$GITHUB_PATH"

      - name: Build
        # The app, then the libtorch plugin it loads on the first AI step.
        run: |
          cargo build-win
          cargo xwin rustc -p evanalyzer_ai --features torch --crate-type cdylib --release --target x86_64-pc-windows-msvc

      - name: Download templates
        uses: actions/download-artifact@v4
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/evanalyzer.exe dist/
          cp libs/libduckdb-windows-amd64/duckdb.dll           dist/
          # The AI plugin with its libtorch in ai\cpu - the app loads it with
          # its own folder searched first (LOAD_LIBRARY_SEARCH_DLL_LOAD_DIR).
          mkdir -p dist/ai/cpu
          cp target/x86_64-pc-windows-msvc/release/evanalyzer_ai.dll dist/ai/cpu/
          cp libs/libtorch/lib/*.dll                           dist/ai/cpu/
          (cd dist && zip -r ../evanalyzer-windows-x86_64.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: evanalyzer-windows-x86_64
          path: evanalyzer-windows-x86_64.zip

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: evanalyzer-windows-x86_64.zip

  build-linux-cuda:
    needs: [templates]
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-cuda

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh linux-cuda

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Build
        # The app, then the libtorch plugin it loads on the first AI step
        # (evanalyzer_ai as a cdylib with its `torch` engine - in a
        # separate command, so the app itself never links libtorch).
        run: |
          cargo build-linux
          cargo build-ai-plugin --release --target x86_64-unknown-linux-gnu

      - name: Download templates
        uses: actions/download-artifact@v4
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/evanalyzer   dist/
          # The AI plugin with its CUDA libtorch in ai/cuda (it runs on the CPU
          # too where there is no GPU). CUDA libtorch ships its runtime as
          # versioned objects (libcudart-<hash>.so.13, libcudnn*.so.9,
          # libgomp-<hash>.so.1, …), so the glob must be *.so* to catch the
          # .so.N files - a plain *.so would ship none of the CUDA libs and the
          # plugin would fail to load. Beside them the CUDA libraries the
          # libtorch zip leaves out (cuFFT, cuRAND, cuSPARSE, nvJitLink - see
          # libs/download.sh).
          mkdir -p dist/ai/cuda
          cp target/x86_64-unknown-linux-gnu/release/libevanalyzer_ai.so dist/ai/cuda/
          cp libs/libtorch/lib/*.so*                               dist/ai/cuda/ 2>/dev/null || true
          cp libs/nvidia-cu13/lib/*.so*                            dist/ai/cuda/
          # Drop LibTorch components this app never reaches regardless of
          # which model is loaded (Python bindings, distributed/profiling/
          # GPUDirect libs, PyTorch's own test fixtures, the Android
          # backend) - see .github/NOT_SHIP_LIST.txt for why each entry is
          # safe. Deliberately conservative: cuDNN's dlopen'd plugins and
          # anything TorchScript's automatic op fusion could reach are kept.
          # Patterns must stay unquoted so the shell glob-expands them (most
          # entries carry a version hash, e.g. libnvshmem_host-<hash>.so.3);
          # the -e guard skips a pattern that matched nothing instead of
          # trying to rm a literal, non-existent "*" filename.
          while IFS= read -r pattern; do
            case "$pattern" in ""|"#"*) continue ;; esac
            for f in dist/ai/cuda/$pattern; do
              [ -e "$f" ] && rm -f "$f"
            done
          done < .github/NOT_SHIP_LIST.txt
          # CUDA is libtorch_cuda, loaded by the app beside the plugin (it
          # registers itself - nothing links it): without it the build runs
          # CPU-only.
          [ -f dist/ai/cuda/libtorch_cuda.so ] || { echo "::error::dist/ai/cuda/libtorch_cuda.so missing - the CUDA build would run CPU-only"; exit 1; }
          # Every library libtorch_cuda needs is in the package (its RUNPATH
          # is $ORIGIN) - a missing one only shows on a user's GPU machine.
          if ldd dist/ai/cuda/libtorch_cuda.so | grep "not found"; then
            echo "::error::libraries libtorch_cuda.so needs are missing from dist/ai/cuda"; exit 1
          fi
          # 7-Zip at maximum compression (-mx=9) keeps it one file below
          # GitHub's 2 GiB release asset limit.
          command -v 7z >/dev/null || { apt-get update -qq && apt-get install -y -qq p7zip-full; }
          ( cd dist && 7z a -t7z -mx=9 ../evanalyzer-linux-x86_64-cuda.7z . )
          size=$(stat -c %s evanalyzer-linux-x86_64-cuda.7z)
          echo "evanalyzer-linux-x86_64-cuda.7z: $((size / 1048576)) MiB"
          [ "$size" -lt 2147483648 ] || { echo "::error::evanalyzer-linux-x86_64-cuda.7z is over GitHub's 2 GiB release asset limit"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: evanalyzer-linux-x86_64-cuda
          path: evanalyzer-linux-x86_64-cuda.7z

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: evanalyzer-linux-x86_64-cuda.7z

  build-windows-cuda:
    needs: [templates]
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-cuda

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh win-cuda

      - name: Unzip DuckDB Windows library
        run: unzip -q libs/libduckdb-windows-amd64.zip -d libs/libduckdb-windows-amd64

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Work around torch-sys clang-cl define bug
        # torch-sys 0.24.0 hands clang-cl an MSBuild property
        # (/p:DefineConstants=GLOG_USE_GLOG_EXPORT) instead of a /D define, which
        # clang-cl rejects as a missing input file (its Linux/macOS path uses the
        # correct -DGLOG_USE_GLOG_EXPORT). Shim clang-cl on PATH to rewrite just
        # that one argument to /DGLOG_USE_GLOG_EXPORT. POSIX sh only - the
        # toolchain container has no bash (steps run under `sh`).
        run: |
          mkdir -p "$HOME/ccshim"
          cat > "$HOME/ccshim/clang-cl" <<'EOF'
          #!/bin/sh
          # Locate the real clang-cl: first one on PATH that isn't this shim.
          selfdir=$(cd "$(dirname "$0")" && pwd)
          real=
          IFS=:
          for d in $PATH; do
            if [ "$d" != "$selfdir" ] && [ -x "$d/clang-cl" ]; then real="$d/clang-cl"; break; fi
          done
          unset IFS
          # Rebuild the argument list, swapping the bad flag for the real define.
          n=0
          for a in "$@"; do
            if [ "$a" = "/p:DefineConstants=GLOG_USE_GLOG_EXPORT" ]; then
              set -- "$@" "/DGLOG_USE_GLOG_EXPORT"
            else
              set -- "$@" "$a"
            fi
            n=$((n + 1))
          done
          shift "$n"
          exec "$real" "$@"
          EOF
          chmod +x "$HOME/ccshim/clang-cl"
          echo "$HOME/ccshim" >> "$GITHUB_PATH"

      - name: Build
        # The app, then the libtorch plugin it loads on the first AI step.
        run: |
          cargo build-win
          cargo xwin rustc -p evanalyzer_ai --features torch --crate-type cdylib --release --target x86_64-pc-windows-msvc

      - name: Download templates
        uses: actions/download-artifact@v4
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/evanalyzer.exe dist/
          cp libs/libduckdb-windows-amd64/duckdb.dll           dist/
          # The AI plugin with its CUDA libtorch in ai\cuda.
          mkdir -p dist/ai/cuda
          cp target/x86_64-pc-windows-msvc/release/evanalyzer_ai.dll dist/ai/cuda/
          cp libs/libtorch/lib/*.dll                           dist/ai/cuda/
          # Drop LibTorch components this app never reaches regardless of
          # which model is loaded - see .github/NOT_SHIP_LIST.txt for why
          # each entry is safe (and what's deliberately kept: cuDNN's
          # dlopen'd plugins, anything TorchScript's automatic op fusion
          # could reach). Patterns must stay unquoted so the shell
          # glob-expands them; the -e guard skips a pattern that matched
          # nothing instead of trying to rm a literal "*" filename.
          while IFS= read -r pattern; do
            case "$pattern" in ""|"#"*) continue ;; esac
            for f in dist/ai/cuda/$pattern; do
              [ -e "$f" ] && rm -f "$f"
            done
          done < .github/NOT_SHIP_LIST.txt
          # CUDA is libtorch_cuda, loaded by the app beside the plugin (it
          # registers itself - nothing links it): without it the build runs
          # CPU-only.
          [ -f dist/ai/cuda/torch_cuda.dll ] || { echo "::error::dist/ai/cuda/torch_cuda.dll missing - the CUDA build would run CPU-only"; exit 1; }
          # 7-Zip at maximum compression (-mx=9) keeps it one file below
          # GitHub's 2 GiB release asset limit.
          command -v 7z >/dev/null || { apt-get update -qq && apt-get install -y -qq p7zip-full; }
          ( cd dist && 7z a -t7z -mx=9 ../evanalyzer-windows-x86_64-cuda.7z . )
          size=$(stat -c %s evanalyzer-windows-x86_64-cuda.7z)
          echo "evanalyzer-windows-x86_64-cuda.7z: $((size / 1048576)) MiB"
          [ "$size" -lt 2147483648 ] || { echo "::error::evanalyzer-windows-x86_64-cuda.7z is over GitHub's 2 GiB release asset limit"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: evanalyzer-windows-x86_64-cuda
          path: evanalyzer-windows-x86_64-cuda.7z

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: evanalyzer-windows-x86_64-cuda.7z

  build-macos:
    needs: [templates]
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh mac-cpu

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Unzip DuckDB macOS library
        run: unzip -q libs/libduckdb-osx-universal.zip -d libs/libduckdb-osx-universal

      - name: Build
        env:
          # DuckDB is not bundled on macOS; point libduckdb-sys at the prebuilt lib.
          DUCKDB_LIB_DIR: ${{ github.workspace }}/libs/libduckdb-osx-universal
          DUCKDB_INCLUDE_DIR: ${{ github.workspace }}/libs/libduckdb-osx-universal
        run: |
          cargo build-mac
          cargo build-ai-plugin --release --target aarch64-apple-darwin

      - name: Download templates
        uses: actions/download-artifact@v4
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/evanalyzer       dist/
          # DuckDB next to the binary; the AI plugin with its libtorch in
          # ai/cpu (loaded on the first AI step).
          cp libs/libduckdb-osx-universal/*.dylib                  dist/ 2>/dev/null || true
          mkdir -p dist/ai/cpu
          cp target/aarch64-apple-darwin/release/libevanalyzer_ai.dylib dist/ai/cpu/
          cp libs/libtorch/lib/*.dylib                             dist/ai/cpu/ 2>/dev/null || true

          # ---- Make the bundle relocatable (adapted from the legacy mac packer) ----
          # libtorch's / DuckDB's dylibs and the binary reference each other by
          # their install names, which on a build machine are @rpath/... or
          # absolute paths that don't exist on a user's Mac. Each library
          # finds its neighbours in its own folder: rewrite every non-system
          # dependency to @executable_path (the binary) / @loader_path (the
          # dylibs) so it resolves wherever the folder is unzipped - no
          # install, just run.
          relink() {                       # relink <macho-file> <path-prefix> <folder>
            local file="$1" prefix="$2" dir="$3" dep base
            otool -L "$file" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                /System/*|/usr/lib/*) continue ;;
              esac
              base="$(basename "$dep")"
              if [ -f "$dir/$base" ]; then
                install_name_tool -change "$dep" "${prefix}/${base}" "$file" || true
              fi
            done
          }
          for dir in dist dist/ai/cpu; do
            for lib in "$dir"/*.dylib; do
              install_name_tool -id "@loader_path/$(basename "$lib")" "$lib" || true
              relink "$lib" "@loader_path" "$dir"
            done
          done
          relink dist/evanalyzer "@executable_path" dist

          # install_name_tool invalidates code signatures - re-sign ad-hoc so
          # macOS will load the rewritten binaries.
          for f in dist/evanalyzer dist/*.dylib dist/ai/cpu/*.dylib; do
            codesign --force --sign - "$f"
          done

          # First-run instructions for end users (Gatekeeper quarantine).
          cat > dist/README.txt <<'EOF'
          EVAnalyzer for macOS (Apple Silicon)
          ====================================

          This build is ad-hoc signed but NOT notarized, so after you download it
          macOS Gatekeeper will quarantine it. To run it:

            1. Open Terminal in this folder.
            2. Clear the quarantine flag (only needed once):
                 xattr -dr com.apple.quarantine evanalyzer
            3. Start the app:
                 ./evanalyzer

          Keep every file in this folder together - the bundled libraries
          (*.dylib, and the AI plugin in ai/cpu) are resolved relative to the
          `evanalyzer` binary.
          EOF

          tar -czf evanalyzer-macos-arm64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: evanalyzer-macos-arm64
          path: evanalyzer-macos-arm64.tar.gz

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: evanalyzer-macos-arm64.tar.gz

  build-linux-arm64:
    # Built natively on GitHub's ARM runner: cross-compiling needs an arm64
    # sysroot for fontconfig (the GUI's font lookup), the native runner
    # has it. The toolchain image is amd64 only, so this runs in the
    # (multi-arch) Rust image it is based on.
    # No AI plugin: pytorch.org publishes no libtorch for Linux ARM64 - AI
    # steps report the plugin as not installed.
    needs: [templates]
    runs-on: ubuntu-24.04-arm
    container:
      image: rust:1.96-trixie
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apt-get update -qq && apt-get install -y -qq mold

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-arm64

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build
        run: cargo build-linux-arm

      - name: Download templates
        uses: actions/download-artifact@v4
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/evanalyzer dist/
          cat > dist/README.txt <<'EOF'
          EVAnalyzer for Linux ARM64
          ==========================

          This build has no support for AI models (PyTorch): PyTorch publishes
          no libtorch for Linux ARM64. Everything else works as on the other
          platforms.
          EOF
          tar -czf evanalyzer-linux-arm64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: evanalyzer-linux-arm64
          path: evanalyzer-linux-arm64.tar.gz

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: evanalyzer-linux-arm64.tar.gz

  build-windows-arm64:
    # Cross-compiled with xwin like the x86_64 build, with the CPU libtorch
    # pytorch.org publishes for Windows ARM64.
    needs: [templates]
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the Rust target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-arm64

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download native dependencies
        run: ./libs/download.sh win-arm64-cpu

      - name: Unzip DuckDB Windows library
        run: unzip -q libs/libduckdb-windows-arm64.zip -d libs/libduckdb-windows-arm64

      - name: Unzip libtorch
        run: unzip -q "libs/libtorch-"*.zip -d libs

      - name: Work around torch-sys clang-cl define bug
        # Same shim as in build-windows - see there.
        run: |
          mkdir -p "$HOME/ccshim"
          cat > "$HOME/ccshim/clang-cl" <<'EOF'
          #!/bin/sh
          # Locate the real clang-cl: first one on PATH that isn't this shim.
          selfdir=$(cd "$(dirname "$0")" && pwd)
          real=
          IFS=:
          for d in $PATH; do
            if [ "$d" != "$selfdir" ] && [ -x "$d/clang-cl" ]; then real="$d/clang-cl"; break; fi
          done
          unset IFS
          # Rebuild the argument list, swapping the bad flag for the real define.
          n=0
          for a in "$@"; do
            if [ "$a" = "/p:DefineConstants=GLOG_USE_GLOG_EXPORT" ]; then
              set -- "$@" "/DGLOG_USE_GLOG_EXPORT"
            else
              set -- "$@" "$a"
            fi
            n=$((n + 1))
          done
          shift "$n"
          exec "$real" "$@"
          EOF
          chmod +x "$HOME/ccshim/clang-cl"
          echo "$HOME/ccshim" >> "$GITHUB_PATH"

      - name: Build
        # The app, then the libtorch plugin it loads on the first AI step.
        run: |
          cargo build-win-arm
          cargo xwin rustc -p evanalyzer_ai --features torch --crate-type cdylib --release --target aarch64-pc-windows-msvc

      - name: Download templates
        uses: actions/download-artifact@v4
        with:
          name: templates
          path: dist/templates

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-pc-windows-msvc/release/evanalyzer.exe dist/
          cp libs/libduckdb-windows-arm64/duckdb.dll           dist/
          mkdir -p dist/ai/cpu
          cp target/aarch64-pc-windows-msvc/release/evanalyzer_ai.dll dist/ai/cpu/
          cp libs/libtorch/lib/*.dll                           dist/ai/cpu/
          (cd dist && zip -r ../evanalyzer-windows-arm64.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: evanalyzer-windows-arm64
          path: evanalyzer-windows-arm64.zip

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: evanalyzer-windows-arm64.zip

  sbom:
    # SBOM for the shipped `evanalyzer` binary (crates/bin), covering its full
    # dependency graph - workspace crates and third-party alike, ~800
    # components. One SBOM for the whole release: Cargo.lock (and so the
    # dependency graph cargo-cyclonedx reads) doesn't vary by target platform
    # or the CPU/CUDA feature split, so per-platform SBOMs would be
    # duplicates.
    needs: [templates]   # uploads into the release created there
    runs-on: ubuntu-latest
    container:
      image: joda001/evanalyzer-toolchain:0.2.0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: sbom

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev"
          fi
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --manifest-path crates/bin/Cargo.toml
          mv crates/bin/evanalyzer_bin.cdx.json evanalyzer-${VERSION}-sbom.cdx.json
          # The AI plugin (evanalyzer_ai with libtorch/tch) is its own
          # library, not linked into the app - its own SBOM.
          cargo cyclonedx --format json --manifest-path crates/ai/Cargo.toml --features torch
          mv crates/ai/evanalyzer_ai.cdx.json evanalyzer-ai-plugin-${VERSION}-sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: evanalyzer-sbom
          path: evanalyzer-*-sbom.cdx.json

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: evanalyzer-*-sbom.cdx.json

