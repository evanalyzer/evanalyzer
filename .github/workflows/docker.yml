#
# The container images (docker/Dockerfile), made from the release's
# command-line packages - nothing is compiled here:
#
#   joda001/evanalyzer:<version>       linux/amd64 (AI plugin, CPU) + linux/arm64
#   joda001/evanalyzer:<version>-cuda  linux/amd64, AI plugin with CUDA
#
# Called by the release (release.yml) after its Linux builds, with their
# packages from the same run: pushed with the version, plus `latest` /
# `cuda` unless it is a pre-release (1.2.0-alpha.1).
# A manual run takes the packages of an existing GitHub release (its tag)
# and only builds the images, or also pushes them with `push` checked -
# e.g. to publish a release's images again.

name: docker

on:
  workflow_call:
    inputs:
      version:
        description: "The release's tag (1.2.0 or v1.2.0)"
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Tag of the GitHub release whose packages go into the images"
        type: string
        required: true
      push:
        description: "Push the images to Docker Hub"
        type: boolean
        default: false

# Reads the repository (and its releases); pushes go to Docker Hub. Each
# pushed image gets a provenance attestation (id-token: Sigstore
# certificate, attestations: stored with the repository and pushed to
# Docker Hub next to the image).
permissions:
  contents: read
  id-token: write
  attestations: write

env:
  IMAGE: joda001/evanalyzer

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: cpu
            platforms: linux/amd64,linux/arm64
            suffix: ""
            latest: latest
          - flavour: cuda
            platforms: linux/amd64
            suffix: "-cuda"
            latest: cuda
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tags
        id: tags
        # The version through env, not pasted into the script: a tag name
        # may contain shell syntax.
        env:
          TAG: ${{ inputs.version }}
        run: |
          VERSION="${TAG#v}"
          TAGS="${IMAGE}:${VERSION}${{ matrix.suffix }}"
          # Pre-releases (a "-" in the version) don't move latest / cuda.
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS},${IMAGE}:${{ matrix.latest }}"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PUSH="${{ inputs.push }}"
          else
            PUSH=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"

      # The release run's packages (its build-linux* jobs)...
      - name: Packages of this release run
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evanalyzer-cli-linux-*
          merge-multiple: true
          path: downloads

      # ...or those of an existing GitHub release.
      - name: Packages of the GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          gh release download "$TAG" --dir downloads \
            --pattern 'evanalyzer-cli-linux-*'

      # One folder per architecture, as docker/Dockerfile expects.
      - name: Unpack
        run: |
          mkdir -p pkg/amd64 pkg/arm64
          if [[ "${{ matrix.flavour }}" == "cuda" ]]; then
            tar -xJf downloads/evanalyzer-cli-linux-x86_64-cuda.tar.xz -C pkg/amd64
          else
            tar -xzf downloads/evanalyzer-cli-linux-x86_64.tar.gz -C pkg/amd64
            tar -xzf downloads/evanalyzer-cli-linux-arm64.tar.gz -C pkg/arm64
          fi
          rm -rf downloads
          du -sh pkg/*

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platforms }}
          build-contexts: package=pkg
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ steps.tags.outputs.push == 'true' }}

      # Verify with: gh attestation verify oci://joda001/evanalyzer:<tag> -R evanalyzer/evanalyzer
      - name: Attest the image
        if: steps.tags.outputs.push == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The repository page on Docker Hub: docker/README.md and the short
      # description, after the images are pushed (once, with the CPU image).
      # The token needs Read, Write & Delete for this - pushing alone needs
      # Read & Write.
      - name: Docker Hub description
        if: steps.tags.outputs.push == 'true' && matrix.flavour == 'cpu'
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: joda001/evanalyzer
          readme-filepath: docker/README.md
          short-description: "EVAnalyzer: find, classify and measure objects in microscopy images - command line and server"
